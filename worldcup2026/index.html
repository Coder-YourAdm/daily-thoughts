*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a1a;color:#e0e0e0;overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 0%,#1a1a3e 0%,#0a0a1a 60%);z-index:-1}

h2{color:#ffd700;margin:15px 0;font-size:1.5em;border-bottom:2px solid rgba(255,215,0,.3);padding-bottom:8px}
h3{color:#ffd700;margin:10px 0;font-size:1.1em}
.btn{background:linear-gradient(135deg,#1a3a5c,#0d2137);color:#ffd700;border:1px solid rgba(255,215,0,.4);padding:12px 28px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .3s;margin:5px}
.btn:hover{background:linear-gradient(135deg,#2a5a8c,#1a3a5c);border-color:#ffd700;transform:translateY(-2px)}
.btn.gold{background:linear-gradient(135deg,#b8860b,#ffd700);color:#0a0a1a;font-weight:700;border:none}
.btn.gold:hover{background:linear-gradient(135deg,#daa520,#ffd700)}
.btn.danger{background:linear-gradient(135deg,#8b0000,#dc143c);border-color:rgba(220,20,60,.5)}
.btn.small{padding:6px 14px;font-size:.85em}
.card{background:rgba(20,20,50,.8);border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:20px;margin:10px 0;backdrop-filter:blur(10px)}
.card:hover{border-color:rgba(255,215,0,.4)}
.team-card{cursor:pointer;text-align:center;transition:all .4s;position:relative;overflow:hidden}
.team-card:hover{transform:translateY(-8px);border-color:#ffd700;box-shadow:0 15px 40px rgba(255,215,0,.2)}
.team-card .flag{font-size:4em;margin:10px 0}
.team-card .name{font-size:1.4em;font-weight:700;color:#ffd700}
.team-card .info{font-size:.85em;color:#aaa;margin-top:5px}
.team-card .rating{display:inline-block;background:rgba(255,215,0,.2);padding:3px 10px;border-radius:20px;font-size:.8em;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.flex{display:flex;gap:15px;flex-wrap:wrap}
.flex-center{display:flex;align-items:center;justify-content:center;gap:10px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.story-text{line-height:1.8;font-size:1.05em;background:rgba(0,0,0,.3);padding:20px;border-radius:10px;border-left:4px solid #ffd700;margin:15px 0}
.choice-btn{display:block;width:100%;text-align:left;padding:15px 20px;margin:8px 0;background:rgba(30,30,60,.8);border:1px solid rgba(255,215,0,.3);border-radius:8px;cursor:pointer;color:#e0e0e0;transition:all .3s}
.choice-btn:hover{background:rgba(40,40,80,.8);border-color:#ffd700;padding-left:30px}
.choice-btn .effect{font-size:.8em;color:#ffa500;margin-top:5px}
.event-log{max-height:300px;overflow-y:auto;padding:10px;background:rgba(0,0,0,.4);border-radius:8px;font-size:.9em}
.event-log .event{padding:6px 10px;margin:3px 0;border-radius:4px;animation:slideIn .3s ease}
.event-log .goal{background:rgba(255,215,0,.2);border-left:3px solid #ffd700}
.event-log .card-event{background:rgba(255,0,0,.15);border-left:3px solid #ff0000}
.event-log .sub{background:rgba(0,200,0,.1);border-left:3px solid #00c800}
.event-log .info-event{background:rgba(100,100,255,.1);border-left:3px solid #6495ed}
.pitch{background:linear-gradient(180deg,#0a2e0a 0%,#134413 20%,#1a5c1a 40%,#1a5c1a 60%,#134413 80%,#0a2e0a 100%);border-radius:20px;padding:0;position:relative;min-height:520px;border:3px solid rgba(255,255,255,.15);box-shadow:inset 0 0 120px rgba(0,0,0,.4);overflow:hidden}
.formation-player{position:absolute;text-align:center;cursor:pointer;transition:all .3s;z-index:2}
.formation-player:hover{transform:scale(1.15);z-index:10}

.formation-player .p-rating{font-size:.65em;color:#ffd700;text-shadow:0 0 5px rgba(0,0,0,.8)}

.formation-player.home .dot{background:rgba(200,50,50,.8)}
.formation-player.away .dot{background:rgba(50,50,200,.8)}
.formation-player.injured .dot{background:#666!important;border-color:#999}
.formation-player.booked .dot::after{content:'⬜';position:absolute;top:-5px;right:-5px;font-size:10px}
.formation-player.subbed .dot{opacity:.5}
.scoreboard{display:flex;align-items:center;justify-content:center;gap:30px;background:rgba(0,0,0,.7);padding:15px 30px;border-radius:15px;margin:15px 0;border:2px solid rgba(255,215,0,.3)}
.scoreboard .team-name{font-size:1.2em;font-weight:700;color:#ffd700}
.scoreboard .score{font-size:3em;font-weight:900;color:#fff}
.scoreboard .score.goal-scored{animation:scorePop .6s ease}
.scoreboard .time{font-size:1em;color:#ffa500;text-align:center}
.match-info-bar{display:flex;justify-content:space-around;background:rgba(0,0,0,.5);padding:10px;border-radius:8px;margin:8px 0;font-size:.85em;flex-wrap:wrap}
.stat-bar{display:flex;align-items:center;gap:8px;margin:5px 0}
.stat-bar .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.stat-bar .fill{height:100%;border-radius:3px;transition:width 1s ease}
.stat-row{display:flex;justify-content:space-between;margin:4px 0;padding:4px 8px;border-radius:4px}
.stat-row:nth-child(odd){background:rgba(255,255,255,.03)}
select,input[type='range']{background:#1a1a3e;color:#e0e0e0;border:1px solid rgba(255,215,0,.3);padding:8px 12px;border-radius:6px;font-size:.9em}
select:focus{outline:none;border-color:#ffd700}
.tab-btn{padding:8px 20px;background:rgba(30,30,60,.5);border:1px solid rgba(255,255,255,.2);color:#aaa;cursor:pointer;border-radius:6px 6px 0 0;transition:all .3s}
.tab-btn.active{background:rgba(40,40,80,.8);color:#ffd700;border-color:rgba(255,215,0,.4);border-bottom-color:transparent}
.tab-content{display:none;padding:15px;background:rgba(20,20,50,.5);border-radius:0 8px 8px 8px;border:1px solid rgba(255,215,0,.15)}
.tab-content.active{display:block}
.player-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin:3px 0;background:rgba(0,0,0,.2);border-radius:6px;cursor:pointer;transition:all .2s}
.player-row:hover{background:rgba(40,40,80,.4)}
.player-row.selected{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4)}
.player-row.inj{opacity:.5}
.player-row .pos-badge{padding:2px 8px;border-radius:4px;font-size:.75em;font-weight:600}
.pos-gk{background:rgba(255,200,0,.3);color:#ffc800}
.pos-def{background:rgba(50,150,255,.3);color:#69b4ff}

.stamina-bar{width:60px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.stamina-fill{height:100%;border-radius:3px;transition:all .5s}
.stamina-high{background:#4caf50}.stamina-mid{background:#ff9800}.stamina-low{background:#f44336}

.modal.active{display:flex!important;justify-content:center!important;align-items:center!important;flex-direction:column!important}

.trophy{font-size:5em;animation:float 3s ease infinite;text-align:center}
.progress-path{display:flex;justify-content:center;gap:5px;margin:20px 0;flex-wrap:wrap}

.progress-node.current{animation:pulse 2s infinite;border-color:#ffd700;background:rgba(255,215,0,.2)}
.progress-node.done{background:rgba(0,200,0,.3);border-color:#4caf50}
.progress-node.lost{background:rgba(255,0,0,.3);border-color:#f44336}
.progress-arrow{display:flex;align-items:center;color:#ffd700;font-size:1.2em}
.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:5em;color:rgba(255,255,255,.03);pointer-events:none;font-weight:900;white-space:nowrap}
.tactic-chip{padding:8px 15px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,.2);font-size:.85em;transition:all .3s;background:rgba(30,30,60,.5)}

.slider-group{margin:12px 0}
.slider-group label{display:block;margin-bottom:4px;color:#ccc;font-size:.9em}

.training-card{padding:15px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,.2);transition:all .3s;text-align:center}

.conflict-indicator{display:inline-block;padding:3px 8px;border-radius:4px;font-size:.75em;background:rgba(255,100,0,.3);color:#ff8c00}

.match-sidebar input[type=range]{padding:2px;font-size:.8em}

@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-200px) rotate(720deg);opacity:0}}
@keyframes trophyShine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.confetti{position:fixed;pointer-events:none;z-index:999;animation:confetti 3s ease-out forwards}
.trophy-icon{animation:float 2s ease infinite,trophyShine 3s ease infinite}
.match-break-modal{text-align:center}
.match-break-modal .btn{margin:8px;min-width:150px}
</style>

{title:'🇵🇹 序幕：为若塔而战',text:'葡萄牙队更衣室里，若塔的球衣静静挂在墙上。自从他去年不幸离世后，这支球队就带着一种不同寻常的力量在战斗。\n\n队长C罗召集全队："每一场比赛，我们都是11个人在场上，但心里有12个人。若塔在天上看着我们。"\n\n然而，主帅马丁内斯的战术安排引发争议——他坚持保守的4-4-2阵型，球队进攻火力可能受到压制。B费私下找到你（教练），希望你能调整战术。',choices:[{text:'支持马丁内斯，稳定为主',effect:'战术纪律+10',morale:0,chem:5,stats:{attack:-1}},{text:'采纳B费建议，调整进攻战术',effect:'进攻创造力+8',morale:8,chem:3,stats:{attack:1}},{text:'召开全队会议，民主决定',effect:'全队团结+15',morale:12,chem:10,stats:{}}]},

{title:'🇵🇹 B费的队长责任',text:'布鲁诺·费尔南德斯作为曼联和葡萄牙的双料核心，承受着巨大压力。媒体批评他在国家队表现不如俱乐部，有声音要求将队长袖标交给C罗。\n\nB费在训练后独自加练到深夜，你看到了他眼中的疲惫和坚定。',choices:[{text:'公开支持B费，确认他的队长地位',effect:'B费能力+3，球队化学+8',morale:5,chem:8,stats:{bfBoost:3}},{text:'将队长袖标交还给C罗',effect:'C罗能力+5，B费可能受影响',morale:10,chem:-5,stats:{cr7Captain:true}},{text:'设立双队长，新老结合',effect:'两人各+2，团结+10',morale:10,chem:10,stats:{dualCaptain:true}}]},
{title:'🇵🇹 莱昂的觉醒',text:'拉斐尔·莱昂在AC米兰展现出了世界级水准，但在国家队他始终无法复制俱乐部的状态。\n\n心理教练报告说莱昂背负着"国家队表现不佳"的心理包袱。今天训练中他又一次在单刀时犹豫了。',choices:[{text:'给莱昂制定专属战术',effect:'莱昂能力+5',morale:8,chem:5,stats:{leaoBoost:5}},{text:'让他打替补，用表现争取首发',effect:'莱昂可能爆发也可能消沉',morale:-5,chem:3,stats:{leaoBench:true}},{text:'安排一对一心理辅导',effect:'莱昂心理包袱解除',morale:8,chem:8,stats:{leaoMental:true}}]},
{title:'🇵🇹 马丁内斯的最后机会',text:'主帅罗伯托·马丁内斯承受着下课压力。葡萄牙媒体批评他的战术"僵化"。足协主席暗示：如果本届世界杯成绩不佳，将不再续约。\n\n马丁内斯在战术会议上提出了大胆方案——放弃传统4后卫，改用3中卫体系。',choices:[{text:'支持马丁内斯的变革',effect:'战术多样性+15',morale:5,chem:-5,stats:{formationNew:true}},{text:'坚持现有体系，稳定为主',effect:'保持稳定',morale:3,chem:8,stats:{}},{text:'折中：部分比赛尝试新阵型',effect:'灵活性+8',morale:5,chem:3,stats:{hybridFormation:true}}]},
{title:'🇵🇹 门德斯vs坎塞洛',text:'努诺·门德斯（91分）和若昂·坎塞洛（87分）都是世界级左后卫。门德斯更年轻、防守更稳健；坎塞洛经验更丰富、进攻更具威胁。\n\n两人在训练中暗自较劲，都希望能成为首发。',choices:[{text:'门德斯首发，坎塞洛替补',effect:'防守稳定性+5',morale:-3,chem:5,stats:{mendesStart:true}},{text:'坎塞洛首发，利用进攻能力',effect:'进攻威胁+5',morale:3,chem:-3,stats:{canceloStart:true}},{text:'根据对手灵活轮换',effect:'两人都保持积极性',morale:5,chem:5,stats:{}}]}

spain:[
{title:'🇪🇸 亚马尔的争议言论',text:'西班牙队内气氛紧张。18岁的亚马尔接受采访时放话："没有我，这支球队的进攻就是一团糟。"这句话激怒了奥亚萨瓦尔和费兰·托雷斯等老将。\n\n主教练德拉富恩特非常愤怒，考虑将亚马尔从首发拿下以示惩戒。但亚马尔的个人能力确实无可替代。',choices:[{text:'力挺亚马尔，继续首发',effect:'亚马尔能力+3，团结度-15',morale:-10,chem:-15,stats:{yamalBoost:3}},{text:'拿下亚马尔，维护纪律',effect:'团结+10，进攻威胁下降',morale:5,chem:15,stats:{yamalOut:true}},{text:'私下谈话，让他公开道歉',effect:'亚马尔+1，团结+5',morale:8,chem:8,stats:{yamalApology:true}}]},
{title:'🇪🇸 传控还是效率？',text:'西班牙传统Tiki-Taka传控在训练中遇到质疑。佩德里在战术会议上直言："有时候我们传了100脚球却进不了禁区，需要更直接的进攻。"\n\n但老将罗德里坚持传控理念："我们的DNA就是控球，失去控球权就什么都不是。"',choices:[{text:'坚持传控，强化训练',effect:'控球率+10%',morale:3,chem:5,stats:{possession:10}},{text:'增加直接进攻元素',effect:'射门次数+15%',morale:5,chem:3,stats:{shots:15}},{text:'根据对手灵活切换',effect:'战术灵活性提升',morale:8,chem:8,stats:{flexible:true}}]},
{title:'🇪🇸 加维的回归',text:'加维经历了严重膝伤后终于重返赛场。但他的状态尚未恢复到100%，在最近的热身赛中明显缺乏自信。\n\n同时，巴埃纳和苏比门迪在加维缺阵期间表现出色，已经站稳了脚跟。加维的主力位置不再稳固。',choices:[{text:'让加维首发，用比赛找回状态',effect:'加维逐渐恢复，士气+8',morale:8,chem:5,stats:{gaviStart:true}},{text:'加维替补，慢慢恢复',effect:'稳妥方案',morale:-3,chem:8,stats:{gaviSub:true}},{text:'让加维尝试不同位置',effect:'加维重获自信',morale:5,chem:8,stats:{gaviNewRole:true}}]},
{title:'🇪🇸 库库雷利亚的救赎',text:'马克·库库雷利亚从切尔西转会皇马后表现起伏不定。西班牙媒体称他为"最被高估的左后卫"。\n\n但在最近训练中，库库雷利亚展现出了惊人斗志——每次拼抢都全力以赴，甚至在对抗中撞破眉骨也不肯下场。',choices:[{text:'公开力挺库库雷利亚',effect:'库库雷利亚+5，士气+5',morale:5,chem:8,stats:{cucuBoost:5}},{text:'让他用表现说话',effect:'无变化',morale:3,chem:3,stats:{}},{text:'私下谈话，减轻心理压力',effect:'库库+3，化学+8',morale:5,chem:8,stats:{cucuMental:3}}]},
{title:'🇪🇸 罗德里的领袖之路',text:'作为曼城和西班牙的双料核心，罗德里被认为是当今世界最好的后腰。但他在国家队一直没有展现出足够的领袖气质。\n\n莫拉塔退出国家队后，西班牙缺少场上的精神领袖。队友们私下说："罗德里应该更多地在场上指挥我们。"',choices:[{text:'正式任命罗德里为第一队长',effect:'罗德里+3，防守组织+10',morale:5,chem:10,stats:{rodriCaptain:true}},{text:'让队内投票选出队长',effect:'民主方式，化学+8',morale:8,chem:8,stats:{voteCaptain:true}},{text:'设立多名队长组成领导小组',effect:'多元化领导',morale:5,chem:5,stats:{}}]},
{title:'🇪🇸 尼科·威廉斯的崛起',text:'尼科·威廉斯在毕尔巴鄂竞技度过了一个爆发性的赛季。他的速度和突破成为西甲后卫的噩梦。\n\n但现在的问题是：他和亚马尔都是右边锋出身。两人如何共存？战术分析师提出了"双翼齐飞"的方案。',choices:[{text:'尼科左路，亚马尔右路，双翼齐飞',effect:'边路进攻威胁+20',morale:10,chem:5,stats:{dualWings:true}},{text:'轮换使用两人，保持体力',effect:'稳定轮换',morale:5,chem:8,stats:{}},{text:'让尼科尝试中锋位置',effect:'战术创新',morale:8,chem:3,stats:{nicoST:true}}]}

{title:'🇫🇷 姆巴佩与登贝莱的裂痕',text:'法国队更衣室气氛剑拔弩张。姆巴佩和登贝莱在场上的配合越来越少——两人都想要球权，都想成为进攻核心。\n\n上次训练中，两人因一次传球选择发生口角。德尚对此非常头疼。',choices:[{text:'确立姆巴佩为核心',effect:'姆巴佩+5，登贝莱受限',morale:-5,chem:-8,stats:{mbappeBoost:5,dembeleNerf:-3}},{text:'双核战术，各打一边',effect:'各自为战',morale:3,chem:-2,stats:{}},{text:'安排团建，化解矛盾',effect:'化学+12，配合+3',morale:10,chem:12,stats:{bothBoost:3}}]},
{title:'🇫🇷 坎特的最后之战',text:'队医传来坏消息：坎特在训练中拉伤了小腿肌肉。这位35岁的老将可能无法在下一场首发。\n\n但坎特本人坚持可以带伤上阵："这可能是我最后一届世界杯了，我不能坐在场下。"',choices:[{text:'冒险让坎特首发',effect:'坎特-5，50%伤退，士气+10',morale:10,chem:5,stats:{kanteRisk:true}},{text:'让楚阿梅尼顶替坎特',effect:'防守稍降，楚阿梅尼成长',morale:2,chem:3,stats:{kanteOut:true,tchouameniBoost:3}},{text:'变阵双后腰',effect:'防守稳定性增强',morale:5,chem:5,stats:{formationChange:true}}]},
{title:'🇫🇷 姆巴佩的金球宣言',text:'赛前新闻发布会上，姆巴佩被问到金球奖的话题。他直言："如果我带领法国队拿下这届世界杯，金球奖就是我的。"\n\n这番言论引发了队内微妙反应——楚阿梅尼、萨利巴等人虽然没有直接回应，但训练中的气氛明显变得紧张。',choices:[{text:'支持姆巴佩的野心',effect:'姆巴佩+5，士气+8',morale:8,chem:-3,stats:{mbappeGoldenBall:true}},{text:'私下提醒姆巴佩注意团队',effect:'姆巴佩收敛，化学+5',morale:3,chem:5,stats:{mbappeHumble:true}},{text:'开队会强调团队高于个人',effect:'化学+10',morale:5,chem:10,stats:{teamFirst:true}}]},
{title:'🇫🇷 萨利巴的成长烦恼',text:'威廉·萨利巴在阿森纳已成为世界顶级中卫，但在国家队他仍然被于帕梅卡诺和科纳泰压制。\n\n萨利巴的天赋毋庸置疑，但比赛经验不如两位竞争对手。体能数据却显示萨利巴的跑动能力和传球成功率都是队内第一。',choices:[{text:'让萨利巴首发，相信数据',effect:'萨利巴+3，防守现代化+10',morale:5,chem:5,stats:{salibaStart:true}},{text:'保持现有中卫组合',effect:'稳定为主',morale:3,chem:8,stats:{}},{text:'轮换使用三名中卫',effect:'保持竞争，化学+5',morale:5,chem:5,stats:{rotateCB:true}}]},
{title:'🇫🇷 特奥的转会风波',text:'特奥·埃尔南德斯转会到沙特联赛后，状态一直不稳定。法国媒体质疑他"为了金钱放弃了竞技水平"。\n\n但特奥在训练中依然是最拼的那个——他的速度测试仍然是全队第一。卢卡·埃尔南德斯公开为弟弟辩护。',choices:[{text:'继续信任特奥，让他首发',effect:'特奥+3，兄弟化学+10',morale:8,chem:10,stats:{theoStart:true}},{text:'让卢卡·迪涅首发更稳妥',effect:'防守更稳定',morale:-3,chem:5,stats:{theoBench:true}},{text:'轮换左后卫，保持竞争',effect:'两人互相促进',morale:5,chem:5,stats:{}}]},
{title:'🇫🇷 奥利塞的魔法左脚',text:'迈克尔·奥利塞在拜仁慕尼黑度过了一个辉煌的赛季。他的左脚技术被誉为"当今足坛前三"。\n\n战术分析师建议围绕奥利塞设计更多的定位球战术。但这也意味着球队需要改变一些既定的进攻套路。',choices:[{text:'围绕奥利塞重新设计定位球',effect:'定位球得分率+20%',morale:5,chem:3,stats:{oliseSetpiece:true}},{text:'保持现有战术体系',effect:'稳定发挥',morale:3,chem:8,stats:{}},{text:'部分定位球交给奥利塞',effect:'折中方案',morale:5,chem:5,stats:{}}]}

{title:'🇧🇪 库尔图瓦与德布劳内的心结',text:'比利时队最大的隐患不是对手，而是自己人。库尔图瓦曾与德布劳内的前女友交往，这件事在队内埋下了多年的裂痕。\n\n两人在国家队共事多年，几乎从不直接交流。但现在，作为门将的库尔图瓦和作为队长的德布劳内必须在场上密切配合。',choices:[{text:'强制两人进行沟通',effect:'60%概率和解，40%恶化',morale:0,chem:0,stats:{riskReconcile:true}},{text:'维持现状，各司其职',effect:'化学-5',morale:0,chem:-5,stats:{}},{text:'请心理教练介入调解',effect:'和解概率80%，团结+8',morale:8,chem:5,stats:{mediation:true}}]},
{title:'🇧🇪 德布劳内依赖症',text:'数据分析师给你看了触目惊心的数据：比利时在德布劳内被重点盯防的比赛中，胜率只有22%。对手策略很明确——锁死德布劳内，进攻就瘫痪了。\n\n蒂勒曼斯和多库都有创造能力，但需要更多战术支持来分担德布劳内的压力。',choices:[{text:'蒂勒曼斯分担组织',effect:'蒂勒曼斯+3',morale:5,chem:5,stats:{tielemansBoost:3}},{text:'强化边路进攻',effect:'多库+2',morale:3,chem:3,stats:{wingBoost:2}},{text:'继续以德布劳内为核心',effect:'德布劳内+5，被锁死则瘫痪',morale:8,chem:2,stats:{kdbSolo:true}}]},
{title:'🇧🇪 卢卡库的大赛心魔',text:'罗梅卢·卢卡库在俱乐部进球如麻，但在国家队大赛中屡次错失关键机会。2022世界杯对阵克罗地亚的噩梦仍然萦绕在他心头。\n\n今天的训练中，卢卡库在射门练习时表现出色，但一到模拟比赛场景就显得犹豫。心理教练说这是"大赛创伤后遗症"。',choices:[{text:'指定心理教练全程陪伴',effect:'卢卡库+5，大赛心理提升',morale:8,chem:5,stats:{lukakuMental:true}},{text:'减轻卢卡库的压力',effect:'卢卡库放松，进攻多样化',morale:5,chem:8,stats:{lukakuRelax:true}},{text:'公开力挺卢卡库',effect:'卢卡库士气+15！',morale:15,chem:5,stats:{lukakuDefend:true}}]},
{title:'🇧🇪 多库的突破艺术',text:'杰雷米·多库是当今足坛最令人兴奋的边锋之一。他的过人成功率在欧洲排名前三。\n\n但对手显然针对多库做了功课——他们用双人包夹来限制他的发挥。多库在训练中显得很沮丧："他们根本不让我拿球！"',choices:[{text:'设计战术让多库内切',effect:'多库+3，战术多样性+10',morale:8,chem:3,stats:{dokuInside:true}},{text:'让多库换边避开防守',effect:'多库获得更多空间',morale:5,chem:5,stats:{dokuSwitch:true}},{text:'利用多库吸引防守',effect:'全队进攻效率+10',morale:5,chem:8,stats:{}}]},
{title:'🇧🇪 黄金一代的最后绝唱',text:'德布劳内、卢卡库、库尔图瓦、维特塞尔——这批"黄金一代"球员已经一起走过了十年。他们最好的成绩是2018世界杯第三名。\n\n这届世界杯将是他们最后的夺冠机会。更衣室里弥漫着一种"now or never"的悲壮气氛。',choices:[{text:'用"最后一舞"激励全队',effect:'士气+20',morale:20,chem:10,stats:{lastDance:true}},{text:'平常心对待，减少压力',effect:'化学+10，稳定',morale:5,chem:10,stats:{}},{text:'让年轻球员担当更多',effect:'新老交替，化学+8',morale:5,chem:8,stats:{newGen:true}}]},
{title:'🇧🇪 德布劳内的退役计划',text:'媒体爆料称德布劳内正在考虑世界杯后退出国家队。这个消息在队内引起了轩然大波。\n\n年轻球员们私下议论纷纷，老将们则显得心情沉重。德布劳内本人没有否认，只是说"我会在合适的时机告诉大家"。',choices:[{text:'深入谈话，希望他继续',effect:'德布劳内受感动+5',morale:10,chem:10,stats:{kdbStay:true}},{text:'尊重决定，让这届成为完美谢幕',effect:'为德布劳内而战，士气+15',morale:15,chem:5,stats:{kdbFarewell:true}},{text:'不公开讨论，专注比赛',effect:'避免干扰',morale:3,chem:5,stats:{}}]}

function makeStoryChoice(idx){
  var story=G.currentStory,c=story.choices[idx];

  G.teamMorale=Math.min(100,Math.max(40,G.teamMorale+c.morale));
  G.teamChemistry=Math.min(100,Math.max(40,G.teamChemistry+c.chem));
  if(c.stats.stamina) for(var k in G.playerStamina) G.playerStamina[k]=Math.min(100,Math.max(50,G.playerStamina[k]+c.stats.stamina));
  if(c.stats.attack!=null) G.tactics.attack=Math.min(4,Math.max(0,G.tactics.attack+(c.stats.attack||0)));
  if(c.stats.possession) G._posBonus=(G._posBonus||0)+c.stats.possession;
  if(c.stats.shots) G._shotsBonus=(G._shotsBonus||0)+c.stats.shots;
  if(c.stats.heatResist) G._heatResist=c.stats.heatResist;
  G._storyEffects=c.stats;
  notify('选择已生效：'+c.effect,'success');
  setTimeout(function(){startPressConference()},800);
}

// ===== LINEUP SYSTEM =====
function getFormation(){return FORMATIONS[G.selectedFormation]}

function autoFillLineup(){
  var team=getUserTeam(),fm=getFormation();
  var pl=team.p.filter(function(p){return !G.playerInjuries[p.n]});
  // Position matching score
  function matchScore(slotLabel,p){
    if(p.ps===slotLabel) return 300;
    if(p.ap===slotLabel) return 200;
    var defP=['CB','RB','LB','RWB','LWB'],midP=['CDM','CAM','CM','LM','RM'],fwdP=['ST','LW','RW','SS','CF'];
    if(slotLabel==='GK'&&p.ps==='GK') return 300;
    if(defP.indexOf(slotLabel)>=0&&defP.indexOf(p.ps)>=0) return 100;
    if(midP.indexOf(slotLabel)>=0&&midP.indexOf(p.ps)>=0) return 100;
    if(fwdP.indexOf(slotLabel)>=0&&fwdP.indexOf(p.ps)>=0) return 100;
    return 0;
  }
  function pickBest(slots,pool){
    var used={},result=[];
    for(var i=0;i<slots.length;i++){
      var best=null,bs=-1;
      for(var j=0;j<pool.length;j++){
        if(used[pool[j].n]) continue;
        var s=matchScore(slots[i].lb,pool[j])+pool[j].rt;
        if(s>bs){bs=s;best=pool[j];}
      }
      if(best){used[best.n]=true;result.push(best);}
      else result.push(null);
    }
    return result;
  }
  var gkP=pl.filter(function(p){return p.ps==='GK'}).sort(function(a,b){return b.rt-a.rt});
  var defP=pl.filter(function(p){return['CB','RB','LB','RWB','LWB'].indexOf(p.ps)>=0}).sort(function(a,b){return b.rt-a.rt});
  var midP=pl.filter(function(p){return['CDM','CAM','CM','LM','RM'].indexOf(p.ps)>=0}).sort(function(a,b){return b.rt-a.rt});
  var fwdP=pl.filter(function(p){return['ST','LW','RW','SS','CF'].indexOf(p.ps)>=0}).sort(function(a,b){return b.rt-a.rt});
  var slots=fm.slots;
  G.lineup.GK=gkP[0]||null;
  G.lineup.DEF=pickBest(slots.DEF,defP.concat(midP));
  G.lineup.MID=pickBest(slots.MID,midP.concat(defP).concat(fwdP));
  G.lineup.FWD=pickBest(slots.FWD,fwdP.concat(midP));
  // Fill any remaining nulls with best available
  var usedNums={};if(G.lineup.GK)usedNums[G.lineup.GK.n]=true;
  G.lineup.DEF.forEach(function(p){if(p)usedNums[p.n]=true});
  G.lineup.MID.forEach(function(p){if(p)usedNums[p.n]=true});
  G.lineup.FWD.forEach(function(p){if(p)usedNums[p.n]=true});
  var allPool=pl.filter(function(p){return !usedNums[p.n]}).sort(function(a,b){return b.rt-a.rt});
  function fillNulls(arr,slots){
    for(var i=0;i<slots.length;i++){
      if(i<arr.length&&arr[i]) continue;
      while(arr.length<=i) arr.push(null);
      for(var j=0;j<allPool.length;j++){
        if(!usedNums[allPool[j].n]){usedNums[allPool[j].n]=true;arr[i]=allPool[j];break;}
      }
    }
  }
  fillNulls(G.lineup.DEF,slots.DEF);
  fillNulls(G.lineup.MID,slots.MID);
  fillNulls(G.lineup.FWD,slots.FWD);
}

function getOpponentBoost(){return G.matchIndex*3;}
function autoFillOpponent(){
  var opp=getOpponent(),fkeys=Object.keys(FORMATIONS);
  G.opponentFormation=fkeys[Math.floor(Math.random()*fkeys.length)];
  var fm=FORMATIONS[G.opponentFormation];
  var pl=[].concat(opp.p).sort(function(a,b){return b.rt-a.rt});
  var gk=pl.filter(function(p){return p.ps==='GK'});
  var def=pl.filter(function(p){return['CB','RB','LB','RWB','LWB'].indexOf(p.ps)>=0}).sort(function(a,b){return b.rt-a.rt});
  var mid=pl.filter(function(p){return['CDM','CAM','CM','LM','RM'].indexOf(p.ps)>=0}).sort(function(a,b){return b.rt-a.rt});
  var fwd=pl.filter(function(p){return['ST','LW','RW','SS','CF'].indexOf(p.ps)>=0}).sort(function(a,b){return b.rt-a.rt});
  var boost=getOpponentBoost();G.opponentLineup.GK=gk[0]?{n:gk[0].n,nm:gk[0].nm,ps:gk[0].ps,rt:gk[0].rt+boost,cl:gk[0].cl,lg:gk[0].lg}:pl[0];
  G.opponentLineup.DEF=def.slice(0,fm.slots.DEF.length).map(function(p){return{n:p.n,nm:p.nm,ps:p.ps,rt:p.rt+boost,cl:p.cl,lg:p.lg}});
  G.opponentLineup.MID=mid.slice(0,fm.slots.MID.length).map(function(p){return{n:p.n,nm:p.nm,ps:p.ps,rt:p.rt+boost,cl:p.cl,lg:p.lg}});
  G.opponentLineup.FWD=fwd.slice(0,fm.slots.FWD.length).map(function(p){return{n:p.n,nm:p.nm,ps:p.ps,rt:p.rt+boost,cl:p.cl,lg:p.lg}});
  while(G.opponentLineup.DEF.length<fm.slots.DEF.length) G.opponentLineup.DEF.push(mid[G.opponentLineup.DEF.length]||def[0]);
  while(G.opponentLineup.MID.length<fm.slots.MID.length) G.opponentLineup.MID.push(def[fm.slots.DEF.length+G.opponentLineup.MID.length]||mid[0]);
  while(G.opponentLineup.FWD.length<fm.slots.FWD.length) G.opponentLineup.FWD.push(mid[fm.slots.MID.length+G.opponentLineup.FWD.length]||fwd[0]);
}

function startLineup(){
  showScreen('lineup');
  // Initialize empty lineup
  G.lineup={GK:null,DEF:[],MID:[],FWD:[]};
  _selectedSlot=null;
  autoFillOpponent();
  renderLineupScreen();
}

function changeFormation(key){
  // Save current players
  var pool=[];
  if(G.lineup.GK) pool.push(G.lineup.GK);
  G.lineup.DEF.forEach(function(p){if(p)pool.push(p)});
  G.lineup.MID.forEach(function(p){if(p)pool.push(p)});
  G.lineup.FWD.forEach(function(p){if(p)pool.push(p)});
  // Change formation
  G.selectedFormation=key;
  // Rebuild lineup with saved players
  G.lineup={GK:null,DEF:[],MID:[],FWD:[]};
  var fm=getFormation();
  // Find GK
  for(var i=0;i<pool.length;i++){if(pool[i].ps==='GK'){G.lineup.GK=pool[i];pool.splice(i,1);break;}}
  // Assign to DEF slots by position match
  var defSlots=fm.slots.DEF,midSlots=fm.slots.MID,fwdSlots=fm.slots.FWD;
  function assignToSlots(slots,arr){
    var result=[],used={};
    for(var i=0;i<slots.length;i++){
      var best=null,bs=-1,bj=-1;
      for(var j=0;j<arr.length;j++){
        if(used[j]) continue;
        var s=(arr[j].ps===slots[i].lb?300:arr[j].ap===slots[i].lb?200:100)+arr[j].rt;
        if(s>bs){bs=s;best=arr[j];bj=j;}
      }
      if(best&&bj>=0){used[bj]=true;result.push(best);}
      else result.push(null);
    }
    return {result:result,used:used};
  }
  var defAssign=assignToSlots(defSlots,pool);
  G.lineup.DEF=defAssign.result;
  var remaining=[];
  for(var i=0;i<pool.length;i++){if(!defAssign.used[i]) remaining.push(pool[i]);}
  var midAssign=assignToSlots(midSlots,remaining);
  G.lineup.MID=midAssign.result;
  remaining=[];
  for(var i=0;i<pool.length;i++){if(!defAssign.used[i]&&!midAssign.used[i]) remaining.push(pool[i]);}
  var fwdAssign=assignToSlots(fwdSlots,remaining);
  G.lineup.FWD=fwdAssign.result;
  // Auto-fill remaining nulls
  var team=getUserTeam();
  var allAvail=team.p.filter(function(p){return !G.playerInjuries[p.n]});
  var usedNums={};if(G.lineup.GK)usedNums[G.lineup.GK.n]=true;
  G.lineup.DEF.forEach(function(p){if(p)usedNums[p.n]=true});
  G.lineup.MID.forEach(function(p){if(p)usedNums[p.n]=true});
  G.lineup.FWD.forEach(function(p){if(p)usedNums[p.n]=true});
  var avail=allAvail.filter(function(p){return !usedNums[p.n]}).sort(function(a,b){return b.rt-a.rt});
  function fillNull(arr,slots){
    for(var i=0;i<slots.length;i++){
      if(i<arr.length&&arr[i]) continue;
      while(arr.length<=i) arr.push(null);
      if(avail.length>0){arr[i]=avail.shift();}
    }
  }
  fillNull(G.lineup.DEF,defSlots);
  fillNull(G.lineup.MID,midSlots);
  fillNull(G.lineup.FWD,fwdSlots);
  if(!G.lineup.GK){var gks=allAvail.filter(function(p){return p.ps==='GK'});if(gks.length)G.lineup.GK=gks[0];}
  renderLineupScreen();
}

function clickBenchPlayer(pNum){
  if(!_selectedSlot){notify('请先在球场上点击一个位置或球员','warning');return;}
  var team=getUserTeam();
  var player=team.p.find(function(p){return p.n===pNum});
  if(!player) return;
  var s=_selectedSlot;

  // Check if player is already in lineup
  var alreadyIn=false;
  if(G.lineup.GK&&G.lineup.GK.n===pNum) alreadyIn=true;
  G.lineup.DEF.forEach(function(p){if(p&&p.n===pNum) alreadyIn=true});
  G.lineup.MID.forEach(function(p){if(p&&p.n===pNum) alreadyIn=true});
  G.lineup.FWD.forEach(function(p){if(p&&p.n===pNum) alreadyIn=true});
  if(alreadyIn&&!s.hasPlayer){notify('该球员已在首发阵容中！','warning');return;}
  // Also check: if replacing, the new player cannot already be in another position
  if(alreadyIn&&s.hasPlayer){notify('该球员已在首发阵容中，不能移动到其他位置','warning');return;}

  // If replacing, put old player back on bench (no-op, just swap)
  var oldName='';
  if(s.hasPlayer&&s.oldNum){
    var oldP=team.p.find(function(p){return p.n===s.oldNum});
    if(oldP) oldName=oldP.nm;
  }

  // Place player in slot
  if(s.type==='GK') G.lineup.GK=player;
  else if(s.type==='DEF'){
    while(G.lineup.DEF.length<=s.idx) G.lineup.DEF.push(null);
    G.lineup.DEF[s.idx]=player;
  }else if(s.type==='MID'){
    while(G.lineup.MID.length<=s.idx) G.lineup.MID.push(null);
    G.lineup.MID[s.idx]=player;
  }else if(s.type==='FWD'){
    while(G.lineup.FWD.length<=s.idx) G.lineup.FWD.push(null);
    G.lineup.FWD[s.idx]=player;
  }

  _selectedSlot=null;
  if(oldName){
    notify(oldName+' ↓ '+player.nm+' ↑ 替换完成','success');
  } else {
    notify(player.nm+' ↑ 加入首发！','success');
  }
  renderLineupPitch();renderStartersList();renderBenchList();
}

function calcGoalProb(){
  var uFwd=0,uMid=0,oFwd=0,oMid=0;
  for(var i=0;i<G.lineup.FWD.length;i++){if(G.lineup.FWD[i])uFwd+=G.lineup.FWD[i].rt}
  for(var i=0;i<G.lineup.MID.length;i++){if(G.lineup.MID[i])uMid+=G.lineup.MID[i].rt}
  for(var i=0;i<G.opponentLineup.FWD.length;i++){if(G.opponentLineup.FWD[i])oFwd+=G.opponentLineup.FWD[i].rt}
  for(var i=0;i<G.opponentLineup.MID.length;i++){if(G.opponentLineup.MID[i])oMid+=G.opponentLineup.MID[i].rt}
  uFwd/=Math.max(1,G.lineup.FWD.filter(function(p){return !!p}).length);
  uMid/=Math.max(1,G.lineup.MID.filter(function(p){return !!p}).length);
  oFwd/=Math.max(1,G.opponentLineup.FWD.filter(function(p){return !!p}).length);
  oMid/=Math.max(1,G.opponentLineup.MID.filter(function(p){return !!p}).length);
  var uAvg=(uFwd+uMid)/2,oAvg=(oFwd+oMid)/2;
  var moraleB=(G.teamMorale-70)/100,chemB=(G.teamChemistry-70)/100,atkB=(G.tactics.attack-2)*0.02;
  var bonus=(G._atkBonus||0)*0.002+(G._defBonus||0)*0.001;
  return Math.max(0.008,Math.min(0.038,0.022+(uAvg-oAvg)*0.002+moraleB*0.5+chemB*0.3+atkB*0.5+bonus));
}

function getRandomScorer(isHome){
  var lineup=isHome?(G.userIsHome?G.lineup:G.opponentLineup):(G.userIsHome?G.opponentLineup:G.lineup);
  // Determine which team is scoring
  var scoringTeam=isHome?(G.userIsHome?getUserTeam():getOpponent()):(G.userIsHome?getOpponent():getUserTeam());
  // Star player numbers per team
  var stars={portugal:7,argentina:10,france:10,belgium:7,spain:19};
  var starNum=stars[scoringTeam.id];
  // Build weighted array: star player appears 3x for higher chance
  var all=[];lineup.FWD.forEach(function(p){if(p){all.push(p);if(p.n===starNum){all.push(p);all.push(p);}}});lineup.MID.forEach(function(p){if(p){all.push(p);if(p.n===starNum){all.push(p);all.push(p);}}});lineup.DEF.forEach(function(p){if(p){all.push(p);if(p.n===starNum){all.push(p);all.push(p);}}});
  return all.length?all[Math.floor(Math.random()*all.length)]:{nm:'球员'};
}

function getRandomPlayer(isHome){
  var lineup=isHome?(G.userIsHome?G.lineup:G.opponentLineup):(G.userIsHome?G.opponentLineup:G.lineup);

  return all.length?all[Math.floor(Math.random()*all.length)]:{nm:'球员'};
}

function simulateMatch(){
  function tick(){
    if(G.matchFinished||G.matchPaused){G._matchTimer=setTimeout(tick,500);return;}
    G.matchMinute++;

    // Water breaks
    if((G.matchMinute===25||G.matchMinute===70)&&!G.isExtraTime&&!G.isPenalties){
      if((G.matchMinute===25&&!G._wb1Done)||(G.matchMinute===70&&!G._wb2Done)){
        if(G.matchMinute===25) G._wb1Done=true;else G._wb2Done=true;
        G.matchPaused=true;addMatchEvent('info','💧 补水暂停 (2026世界杯特殊规则)');updateScoreboard();
        setTimeout(function(){showBreakMenu('💧 补水暂停','球员们正在补水降温。利用这段时间调整战术或进行换人。')},200);return;
      }
    }

    // Half time
    if(G.matchMinute===46&&G.matchHalf===1&&!G.isExtraTime){
      G.matchPaused=true;var added=1+Math.floor(Math.random()*5);
      addMatchEvent('info','⏸️ 上半场结束 · 伤停补时 +'+added+'分钟');
      var analysis=G.matchHomeScore>G.matchAwayScore?'主队掌控了比赛节奏':G.matchHomeScore<G.matchAwayScore?'客队效率更高，抓住了机会':'双方势均力敌，下半场将是真正的考验';
      addMatchEvent('info','📊 半场比分 '+G.matchHomeScore+' - '+G.matchAwayScore+' · '+analysis);updateScoreboard();
      G.matchHalf=2;G.matchMinute=45;
      setTimeout(function(){showBreakMenu('⏸️ 中场休息','半场比分 '+G.matchHomeScore+' - '+G.matchAwayScore+'。利用这15分钟调整战术、鼓舞士气或进行换人。')},200);return;
    }

    if(G.matchMinute===91&&G.matchHalf===2&&!G.isExtraTime){
      G.matchStoppageTime=1+Math.floor(Math.random()*6);
      addMatchEvent('info','⏱️ 常规时间结束 · 伤停补时 +'+G.matchStoppageTime+'分钟');G.matchMinute=90;
    }

    // Extra time check
    if(G.matchMinute>=90+G.matchStoppageTime&&G.matchHalf===2&&!G.isExtraTime&&!G.isPenalties){
      if(G.matchHomeScore===G.matchAwayScore){
        G.matchPaused=true;addMatchEvent('info','⏰ 常规时间结束！比分持平，进入加时赛！');
        G.isExtraTime=true;G.matchHalf=3;G.matchMinute=90;G.matchStoppageTime=0;G._wb1Done=false;G._wb2Done=false;updateScoreboard();
        setTimeout(function(){G.matchPaused=false;addMatchEvent('info','▶️ 加时赛上半场开始 (15分钟)');simulateMatch()},2000);return;
      }else{endGame();return;}
    }

    // Extra time half
    if(G.isExtraTime&&G.matchMinute>=106&&G.matchHalf===3){
      var added=Math.floor(Math.random()*3);addMatchEvent('info','⏸️ 加时赛上半场结束 · 补时 +'+added+'分钟');
      G.matchHalf=4;G.matchMinute=105;G.matchStoppageTime=added;G.matchPaused=true;
      setTimeout(function(){showBreakMenu('⏸️ 加时赛半场休息','短暂的休息时间。球员们已经筋疲力尽，需要你的鼓励！')},200);return;
    }

    if(G.isExtraTime&&G.matchMinute>=120+(G.matchStoppageTime||2)&&G.matchHalf===4){
      if(G.matchHomeScore===G.matchAwayScore){startPenalties();return;}else{endGame();return;}
    }

    // Random events (1 in 40 chance per tick)
    if(Math.random()<0.025&&!G.matchPaused) doRandomEvent();

    // Goal check (capped for realistic scores)
    var maxGoals=G.isExtraTime?1:3;
    var homeGoals=G.matchEvents.filter(function(e){return e.type==='goal'&&e.team==='home'&&(G.matchHalf===G.matchHalf)}).length;
    var awayGoals=G.matchEvents.filter(function(e){return e.type==='goal'&&e.team==='away'}).length;
    if(Math.random()<calcGoalProb()&&homeGoals<maxGoals&&awayGoals<maxGoals){
      var isHome=Math.random()<(G.userIsHome?0.53:0.47);
      if(isHome) G.matchHomeScore++;else G.matchAwayScore++;
      var scorer=getRandomScorer(isHome);
      var cheers=['📢 全场沸腾！球迷疯狂庆祝！','🔥 看台变成了欢腾的海洋！','🎉 球迷们高呼'+scorer.nm+'的名字！','💥 震撼世界的一击！'];addMatchEvent('goal','⚽ GOAL！'+scorer.nm+' 破门！('+G.matchHomeScore+'-'+G.matchAwayScore+') '+cheers[Math.floor(Math.random()*cheers.length)]);
      if(!G.playerStats[scorer.n])G.playerStats[scorer.n]={goals:0,assists:0,shots:0,tackles:0,saves:0,rating:0};
      G.playerStats[scorer.n].goals=(G.playerStats[scorer.n].goals||0)+1;
      G.playerStats[scorer.n].rating+=10;
      // Accumulate career stats
      if(!G.careerStats[scorer.n])G.careerStats[scorer.n]={goals:0,matches:0,rating:0};
      G.careerStats[scorer.n].goals=(G.careerStats[scorer.n].goals||0)+1;
      G.careerStats[scorer.n].rating=(G.careerStats[scorer.n].rating||0)+10;
      var el=document.getElementById(isHome?'match-home-score':'match-away-score');
      if(el){el.classList.add('goal-scored');setTimeout(function(){el.classList.remove('goal-scored')},600);}
    }

    // Card check
    if(Math.random()<0.015){
      var isHome=Math.random()<0.5,ct=Math.random()<0.2?'🟥 红牌':'🟨 黄牌';
      var cp=getRandomPlayer(isHome);addMatchEvent('card',ct+' '+cp.nm+' 被裁判警告');if(ct.indexOf('黄')>=0){G.playerCards[cp.n]=(G.playerCards[cp.n]||0)+1;if(G.playerCards[cp.n]>=2){addMatchEvent('card','⛔ '+cp.nm+' 累积两张黄牌，下一场停赛！');G.playerInjuries[cp.n]=true;}}
    }

    // Position-based stamina drain every 5 min (only field players)
    if(G.matchMinute%5===0){
      var onField={},posMap={};
      if(G.lineup.GK){onField[G.lineup.GK.n]=true;posMap[G.lineup.GK.n]='GK'}
      G.lineup.DEF.forEach(function(p){if(p){onField[p.n]=true;posMap[p.n]='DEF'}});
      G.lineup.MID.forEach(function(p){if(p){onField[p.n]=true;posMap[p.n]='MID'}});
      G.lineup.FWD.forEach(function(p){if(p){onField[p.n]=true;posMap[p.n]='FWD'}});
      for(var k in G.playerStamina){
        if(!onField[k]) continue;
        // Position-based drain: GK<DEF<MID<FWD
        var base=G.isExtraTime?2.5:(G._heatResist?1.2:1.8);
        if(posMap[k]==='GK') base*=0.4;
        else if(posMap[k]==='DEF') base*=0.7;
        else if(posMap[k]==='MID') base*=1.0;
        else base*=1.2;
        G.playerStamina[k]=Math.max(10,G.playerStamina[k]-base);
      }
    }

    updateScoreboard();
    if(G.matchMinute<130) G._matchTimer=setTimeout(tick,G.matchPaused?500:G.matchSpeed);
  }
  tick();
}

function doSubIn(num){
  var pend=window._pendOut||_pendOut;
  if(!pend||G._subsLeft<=0)return;
  var team=getUserTeam();
  var outP=team.p.find(function(p){return p.n===pend});
  var inP=team.p.find(function(p){return p.n===num});
  if(!outP||!inP)return;
  // Track subbed-out player so they can't return
  if(!G._subsUsed) G._subsUsed=[];
  G._subsUsed.push(outP.n);
  G._subsLeft--;
  // Record minutes: subbed-out player's end time, subbed-in player's start time
  var currMin=G.matchMinute>90?90:G.matchMinute;
  if(G.playerMinutes[outP.n]) G.playerMinutes[outP.n].end=currMin;
  G.playerMinutes[inP.n]={start:currMin,end:90,subbed:true};
  addMatchEvent('sub','🔄 换人('+(5-G._subsLeft)+'/5)：'+inP.nm+' ↑ '+outP.nm+' ↓ ('+currMin+"')");
  if(G.lineup.GK&&G.lineup.GK.n===outP.n) G.lineup.GK=inP;
  G.lineup.DEF=G.lineup.DEF.map(function(p){return p&&p.n===outP.n?inP:p});
  G.lineup.MID=G.lineup.MID.map(function(p){return p&&p.n===outP.n?inP:p});
  G.lineup.FWD=G.lineup.FWD.map(function(p){return p&&p.n===outP.n?inP:p});
  window._pendOut=null;_pendOut=null;G.matchPaused=false;
  closeModal();
  document.getElementById('match-actions').innerHTML=renderMatchActions();
  renderMatchPitch();updateScoreboard();
}

  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85em">';
  h+='<tr style="color:#ffd700;border-bottom:1px solid rgba(255,215,0,.3)"><th style="padding:6px;text-align:left">球员</th><th>位置</th><th>出场</th><th>评分</th><th>进球</th><th>体力</th></tr>';
  startersP.sort(function(a,b){return b.rt-a.rt});
  var starters=startersP;
  for(var i=0;i<starters.length;i++){
    var p=starters[i];
    var st=G.playerStamina[p.n]||100;
    var goals=(G.playerStats[p.n]&&G.playerStats[p.n].goals)||0;
    var rt=(G.playerStats[p.n]&&G.playerStats[p.n].rating)?p.rt+Math.floor((G.playerStats[p.n].rating||0)/3):p.rt;
    rt=Math.min(99,rt);
    var posCls=p.ps==='GK'?'pos-gk':['CB','RB','LB'].indexOf(p.ps)>=0?'pos-def':['CDM','CAM','CM'].indexOf(p.ps)>=0?'pos-mid':'pos-fwd';
    h+='<tr style="border-bottom:1px solid rgba(255,255,255,.05)"><td style="padding:6px">'+p.nm+'</td>';
    h+='<td><span class="pos-badge '+posCls+'">'+p.ps+'</span></td>';
    var mins=G.playerMinutes[p.n]?Math.max(1,G.playerMinutes[p.n].end-(G.playerMinutes[p.n].start||0)):'90';
    var subTag=G.playerMinutes[p.n]&&G.playerMinutes[p.n].subbed?' 🔄':'';
    h+='<td style="text-align:center;font-size:.8em">'+mins+"'"+subTag+'</td>';
    h+='<td style="text-align:center;color:#ffd700;font-weight:700">'+rt+'</td>';
    h+='<td style="text-align:center">'+(goals>0?'⚽'+goals:'-')+'</td>';
    h+='<td><div class="stamina-bar"><div class="stamina-fill stamina-'+(st>70?'high':st>40?'mid':'low')+'" style="width:'+st+'%"></div></div> '+st+'</td></tr>';
  }
  h+='</table></div></div>';

  // ===== MEDIA REVIEWS =====
  h+='<div class="card"><h2>📰 媒体点评</h2>';
  var reviews=generateMediaReviews(won,lm,team,opp);
  for(var i=0;i<reviews.length;i++){
    var r=reviews[i];
    h+='<div style="margin:8px 0;padding:10px 14px;background:rgba(0,0,0,.2);border-radius:8px;border-left:3px solid '+r.color+'">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:1.2em">'+r.icon+'</span><strong style="color:'+r.color+'">'+r.outlet+'</strong><span style="color:#aaa;font-size:.75em">'+r.author+'</span></div>';
    h+='<div style="color:#ccc;font-size:.9em;line-height:1.5">'+r.text+'</div></div>';
  }
  h+='</div>';

  h+='<div class="card"><h2>🎙️ 赛后新闻发布会</h2><div class="story-text"><p><strong>记者：</strong>"'+(won?'恭喜您取得胜利！球队今天的表现您满意吗？':'很遗憾输掉了比赛，您认为球队哪里做得不够好？')+'"</p></div>';
  var opts=[{text:won?'球队表现完美，我为球员们骄傲':'我们尽了全力，但对手确实更强',e:won?'士气+5':'士气-2'},{text:won?'还有很多需要改进的地方':'裁判的判罚影响了比赛走势',e:won?'关注度+3':'关注度-3'},{text:won?'感谢球迷的支持，我们会走得更远':'我们会从失败中吸取教训',e:won?'化学+3':'化学+3'}];
  for(var i=0;i<opts.length;i++){
    h+='<div class="choice-btn" onclick="handlePostMatch('+i+','+won+')"><strong>选项'+(i+1)+'：</strong>'+opts[i].text+' <span style="color:#ffa500">('+opts[i].e+')</span></div>';
  }
  h+='</div>';
  document.getElementById('postmatch-content').innerHTML=h;
}

function handlePostMatch(idx,won){
  if(won){if(idx===0)G.teamMorale=Math.min(100,G.teamMorale+5);if(idx===1)G.teamChemistry=Math.min(100,G.teamChemistry+3);if(idx===2)G.teamChemistry=Math.min(100,G.teamChemistry+3)}
  else{if(idx===0)G.teamMorale=Math.max(30,G.teamMorale-2);if(idx===2)G.teamChemistry=Math.min(100,G.teamChemistry+3)}
  notify('发布会结束');setTimeout(function(){startTraining()},800);
}

// ===== TRAINING =====
function startTraining(){
  showScreen('training');
  var ts=[{name:'战术演练',icon:'📋',desc:'强化战术执行力，提升球队化学',eff:{chem:8,morale:3}},{name:'体能强化',icon:'💪',desc:'针对性体能训练，恢复球员体力',eff:{stamina:15}},{name:'进攻训练',icon:'⚽',desc:'强化射门和进攻配合',eff:{attack:1,morale:5}},{name:'防守特训',icon:'🛡️',desc:'针对对手特点的防守演练',eff:{def:1,chem:3}},{name:'定位球训练',icon:'🎯',desc:'角球和任意球战术演练',eff:{setpiece:1,morale:3}},{name:'心理辅导',icon:'🧘',desc:'运动心理专家进行团队心理建设',eff:{morale:10,chem:5}},{name:'恢复训练',icon:'🏊',desc:'低强度恢复训练，减轻疲劳',eff:{stamina:10,injury:-5}},{name:'视频分析',icon:'🎬',desc:'研究对手战术特点，制定对策',eff:{tactics:1,chem:2}}];
  G._trainSel=[];G._trainData=ts;
  var h='<div class="card"><div class="flex-between"><div><span style="font-size:2em">'+getUserTeam().flag+'</span> <strong>下一场：'+getOpponent().name+' '+getOpponent().flag+'</strong></div><span class="stadium-badge">'+G.tournamentStage+'</span></div><div style="margin-top:10px;color:#aaa">🏟️ '+(G.stadium?G.stadium.name:'待定')+'</div></div>';
  h+='<h2>选择训练项目 (选择2项)</h2><div class="grid3" id="training-grid">';
  for(var i=0;i<ts.length;i++){
    h+='<div class="training-card" id="train-'+i+'" onclick="selTrain('+i+')"><div class="icon">'+ts[i].icon+'</div><div style="font-weight:600;color:#ffd700">'+ts[i].name+'</div><div style="font-size:.85em;color:#aaa">'+ts[i].desc+'</div></div>';
  }
  h+='</div><div class="flex-center" style="margin-top:20px"><button class="btn gold" id="confirm-train-btn" onclick="confirmTrain()" disabled>确认训练 (已选0/2)</button></div>';
  document.getElementById('training-content').innerHTML=h;
}

function selTrain(idx){
  if(G._trainSel.indexOf(idx)>=0){G._trainSel=G._trainSel.filter(function(i){return i!==idx});var el=document.getElementById('train-'+idx);if(el){el.style.borderColor='rgba(255,255,255,.2)';el.style.background=''}}
  else if(G._trainSel.length<2){G._trainSel.push(idx);var el=document.getElementById('train-'+idx);if(el){el.style.borderColor='#ffd700';el.style.background='rgba(255,215,0,.15)'}}
  var btn=document.getElementById('confirm-train-btn');btn.textContent='确认训练 (已选'+G._trainSel.length+'/2)';btn.disabled=G._trainSel.length<2;
}

function confirmTrain(){
  G._trainSel.forEach(function(idx){var t=G._trainData[idx];
    if(t.eff.chem)G.teamChemistry=Math.min(100,Math.max(30,G.teamChemistry+t.eff.chem));
    if(t.eff.morale)G.teamMorale=Math.min(100,Math.max(30,G.teamMorale+t.eff.morale));
    if(t.eff.stamina)for(var k in G.playerStamina)G.playerStamina[k]=Math.min(100,G.playerStamina[k]+t.eff.stamina);
    if(t.eff.attack)G.tactics.attack=Math.min(4,G.tactics.attack+1);
    if(t.eff.def)G.tactics.defense=Math.min(4,G.tactics.defense+1);
    if(t.eff.setpiece)G.tactics.setpiece=Math.min(4,G.tactics.setpiece+1);
    if(t.eff.tactics)G.tactics.special=Math.min(4,G.tactics.special+1);
    if(t.eff.injury)for(var k in G.playerInjuries){if(G.playerInjuries[k]&&Math.random()<0.4)G.playerInjuries[k]=false;}
  });
  notify('训练完成！球队状态已更新','success');G._trainSel=[];
  setTimeout(function(){showProgress()},1000);
}

// ===== PROGRESS =====
function showProgress(){
  showScreen('progress');var team=getUserTeam();
  var stages=['八分之一决赛','四分之一决赛','半决赛','决赛'];
  var pH='';
  for(var i=0;i<4;i++){
    var cls='progress-node';if(i<G.matchIndex)cls+=' done';else if(i===G.matchIndex&&G.matchIndex<4)cls+=' current';
    var label=i<G.matchHistory.length?(G.matchHistory[i].userScore||'?')+'-'+(G.matchHistory[i].oppScore||'?'):(i===G.matchIndex?'VS':'?');
    pH+='<div class="'+cls+'">'+label+'</div>';
    if(i<3) pH+='<div class="progress-arrow">→</div>';
  }
  var mh='';
  for(var i=0;i<G.matchHistory.length;i++){
    var m=G.matchHistory[i],opp=TEAMS[m.opponent];
    mh+='<div class="card" style="text-align:center"><div style="font-size:.85em;color:#aaa">'+m.stage+'</div><div style="font-size:1.5em">'+team.flag+' <strong>'+m.userScore+'-'+m.oppScore+'</strong> '+opp.flag+'</div><div style="font-size:.8em;color:'+(m.won?'#4caf50':'#f44336')+'">'+(m.won?'✅ 胜利':'❌ 失利')+'</div><div style="font-size:.75em;color:#aaa">🏟️ '+m.stadium.name+'</div></div>';
  }
  var h='<div class="card" style="text-align:center"><div style="font-size:3em">'+team.flag+'</div><h2>'+team.name+' · 世界杯之路</h2><div class="progress-path">'+pH+'</div><div style="margin:15px 0"><div>📊 球队士气：'+G.teamMorale+' | 🤝 球队化学：'+G.teamChemistry+'</div></div><div class="grid2" style="margin-top:15px">'+mh+'</div></div>';
  h+='<div class="flex-center" style="margin-top:20px"><button class="btn gold" onclick="nextMatch()" style="font-size:1.2em;padding:15px 40px">继续 → '+G.tournamentStage+' · '+getOpponent().name+' '+getOpponent().flag+'</button></div>';
  document.getElementById('progress-content').innerHTML=h;
}

function nextMatch(){
  G.stadium=STADIUMS[Math.floor(Math.random()*STADIUMS.length)];
  G.weather={temp:25+Math.floor(Math.random()*15),condition:['☀️ 晴','⛅ 多云','🌤️ 晴间多云'][Math.floor(Math.random()*3)]};
  startStory();
}

// ===== GAME OVER =====
function showVictory(){
  showScreen('gameover');var team=getUserTeam();
  document.getElementById('gameover-emoji').innerHTML='<div style="animation:float 2s ease infinite;font-size:2em">🏆🏆🏆</div>';
  document.getElementById('gameover-title').innerHTML='<span style="animation:glow 1.5s infinite">🌟 世界冠军！🌟</span>';
  var mh='',tg=0,ta=0;
  for(var i=0;i<G.matchHistory.length;i++){var m=G.matchHistory[i],opp=TEAMS[m.opponent];tg+=m.userScore;ta+=m.oppScore;
    mh+='<div style="margin:8px 0;padding:8px;background:rgba(255,215,0,.05);border-radius:8px"><strong>'+m.stage+'</strong><br><span style="font-size:1.3em">'+team.flag+' '+m.userScore+' - '+m.oppScore+' '+opp.flag+'</span><br><span style="color:'+(m.won?'#4caf50':'#f44336')+'">'+(m.won?'✅ 胜利':'❌ 失利')+'</span> · 🏟️ '+m.stadium.name+'</div>'}
  // Calculate MVP across all matches using career stats
  var allPlayers=team.p.slice();
  allPlayers.sort(function(a,b){
    var sa=(G.careerStats[a.n]?G.careerStats[a.n].goals||0:0)*15+(G.careerStats[a.n]?G.careerStats[a.n].rating||0:0);
    var sb=(G.careerStats[b.n]?G.careerStats[b.n].goals||0:0)*15+(G.careerStats[b.n]?G.careerStats[b.n].rating||0:0);
    return sb-sa;
  });
  var mvp=allPlayers[0];
  var mvpGoals=(G.careerStats[mvp.n]&&G.careerStats[mvp.n].goals)||0;
  var mvpMatches=G.matchHistory.length;
  document.getElementById('gameover-content').innerHTML='<div style="text-align:center;animation:slideUp .8s ease">'+
    '<div style="font-size:6em;animation:float 2s ease infinite">🏆</div>'+
    '<div style="background:linear-gradient(135deg,rgba(255,215,0,.3),rgba(255,180,0,.1));border:3px solid rgba(255,215,0,.6);border-radius:20px;padding:30px;margin:20px 0">'+
    '<div style="font-size:3em;margin:10px 0">'+team.flag+'</div>'+
    '<h1 style="font-size:2.5em;color:#ffd700;animation:glow 1.5s infinite;margin:10px 0">'+team.name+'</h1>'+
    '<h2 style="color:#ffd700;font-size:2em;margin:10px 0">🏆 2026 世界杯冠军 🏆</h2>'+
    '<p style="font-size:1.1em;color:#ccc;margin:15px 0">经过'+G.matchHistory.length+'场艰苦卓绝的战斗，'+team.name+'终于站在了世界之巅！</p>'+
    '<p style="color:#ffd700;font-size:1em">🌟 赛事MVP：'+mvp.nm+' ('+mvp.rt+'分 | ⚽'+mvpGoals+'球 | '+mvpMatches+'场)</p><p style="color:#aaa;font-size:.85em">🧤 零封场次：'+G.matchHistory.filter(function(m){return m.oppScore===0}).length+' | 🟨 总黄牌：'+Object.values(G.playerCards).reduce(function(a,b){return a+b},0)+' | 🏟️ 场均观众：'+Math.floor(60000+Math.random()*20000)+'</p>'+
    '</div>'+
    '<div style="display:flex;gap:15px;flex-wrap:wrap;justify-content:center;margin:20px 0">'+
    '<div class="card" style="text-align:center;min-width:120px"><div style="font-size:2em">⚽</div><div style="font-size:2em;color:#ffd700;font-weight:900">'+tg+'</div><div>总进球</div></div>'+
    '<div class="card" style="text-align:center;min-width:120px"><div style="font-size:2em">🛡️</div><div style="font-size:2em;color:#ffd700;font-weight:900">'+ta+'</div><div>总失球</div></div>'+
    '<div class="card" style="text-align:center;min-width:120px"><div style="font-size:2em">📊</div><div style="font-size:2em;color:#ffd700;font-weight:900">'+G.teamMorale+'</div><div>球队士气</div></div>'+
    '<div class="card" style="text-align:center;min-width:120px"><div style="font-size:2em">🤝</div><div style="font-size:2em;color:#ffd700;font-weight:900">'+G.teamChemistry+'</div><div>球队化学</div></div>'+
    '</div>'+
    '<h3 style="color:#ffd700;margin-top:20px">🏟️ 夺冠之路</h3>'+
    '<div style="max-width:500px;margin:0 auto">'+mh+'</div>'+
    '</div><div class="flex-center" style="margin-top:20px"><button class="btn gold" onclick="location.reload()" style="font-size:1.2em;padding:15px 40px">🔄 再来一次</button></div>';
}

function showElimination(){
  showScreen('gameover');var team=getUserTeam();
  document.getElementById('gameover-emoji').textContent='😢';
  document.getElementById('gameover-title').textContent='世界杯之旅结束';
  var mh='';for(var i=0;i<G.matchHistory.length;i++){var m=G.matchHistory[i],opp=TEAMS[m.opponent];mh+='<div style="margin:5px 0">'+m.stage+'：'+team.flag+' '+m.userScore+' - '+m.oppScore+' '+opp.flag+' '+(m.won?'✅':'❌')+'</div>'}
  document.getElementById('gameover-content').innerHTML='<div class="card" style="text-align:center;animation:slideUp .8s ease"><div style="font-size:5em">'+team.flag+'</div><h2>'+team.name+' 止步'+G.tournamentStage+'</h2><p style="color:#aaa">但这支球队的精神将永远传承下去...</p><div style="margin:20px 0">'+mh+'</div></div><div class="flex-center" style="margin-top:20px"><button class="btn gold" onclick="location.reload()" style="font-size:1.2em">🔄 重新开始</button></div>';
}

// ===== INIT =====
renderTeamSelect();

</script>
