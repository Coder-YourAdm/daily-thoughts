// ===== DAY CYCLE (5min) =====
function dayPhase(t){
  const p=t/300; // 0-1
  let top,mid,bot,ca,wc;
  // Lerp helper
  const L=(a,b,f)=>Math.round(a+(b-a)*f);
  const Lrgb=(r1,g1,b1,r2,g2,b2,f)=>`rgb(${L(r1,r2,f)},${L(g1,g2,f)},${L(b1,b2,f)})`;
  const Lrgba=(r1,g1,b1,a1,r2,g2,b2,a2,f)=>`rgba(${L(r1,r2,f)},${L(g1,g2,f)},${L(b1,b2,f)},${(a1+(a2-a1)*f).toFixed(2)})`;

  if(p<0.12){// 0-36s: night→dawn (purple→light blue)
    const f=p/0.12;
    top=Lrgb(15,10,40,80,150,220,f);mid=Lrgba(20,15,45,0.5,60,140,210,0.85,f);bot=Lrgba(0,0,0,0,100,180,240,0,f);ca=0.05+0.65*f;wc='rgba(20,55,110,0.55)';
  }else if(p<0.25){// 36-75s: dawn→morning (light blue)
    const f=(p-0.12)/0.13;
    top=Lrgb(80,150,220,120,185,235,f);mid=Lrgba(60,140,210,0.85,120,185,235,0.95,f);bot=Lrgba(100,180,240,0,120,200,245,0,f);ca=0.7+0.3*f;wc='rgba(18,50,95,0.5)';
  }else if(p<0.4){// 75-120s: morning→deep blue
    const f=(p-0.25)/0.15;
    top=Lrgb(120,185,235,55,128,204,f);mid=Lrgba(120,185,235,0.95,94,168,232,0.9,f);bot=Lrgba(120,200,245,0,100,180,240,0,f);ca=1;wc='rgba(18,50,95,0.5)';
  }else if(p<0.5){// 120-150s: deep blue→light blue
    const f=(p-0.4)/0.1;
    top=Lrgb(55,128,204,120,185,235,f);mid=Lrgba(94,168,232,0.9,120,185,235,0.95,f);bot=Lrgba(100,180,240,0,120,200,245,0,f);ca=1;wc='rgba(18,50,95,0.5)';
  }else if(p<0.6){// 150-180s: light blue→orange (sunset!)
    const f=(p-0.5)/0.1;
    top=Lrgb(120,185,235,240,140,60,f);mid=Lrgba(120,185,235,0.95,240,160,80,0.9,f);bot=Lrgba(120,200,245,0,220,150,60,0,f);ca=1-0.5*f;wc='rgba(20,55,100,0.5)';
  }else if(p<0.7){// 180-210s: orange→blue-purple (twilight)
    const f=(p-0.6)/0.1;
    top=Lrgb(240,140,60,60,40,100,f);mid=Lrgba(240,160,80,0.9,70,50,110,0.7,f);bot=Lrgba(220,150,60,0,30,20,60,0,f);ca=0.5-0.35*f;wc='rgba(20,55,100,0.5)';
  }else if(p<0.85){// 210-255s: blue-purple→purple-black (night)
    const f=(p-0.7)/0.15;
    top=Lrgb(60,40,100,15,10,30,f);mid=Lrgba(70,50,110,0.7,12,8,25,0.5,f);bot=Lrgba(30,20,60,0,0,0,0,0,f);ca=0.15-0.1*f;wc=`rgba(${L(20,18,f)},${L(55,35,f)},${L(100,60,f)},0.55)`;
  }else{// 255-300s: purple-black→night (deepen then dawn prep)
    const f=(p-0.85)/0.15;
    top=Lrgb(15,10,30,15,10,40,f);mid=Lrgba(12,8,25,0.5,20,15,45,0.5,f);bot='rgba(0,0,0,0)';ca=0.05;wc='rgba(18,35,60,0.55)';
  }
  // Sun position: arc from left (rise) to right (set), visible during day
  const sunAngle=(p-0.04)*Math.PI; // 0.04→sunrise start, 1.04→sunset end
  const sunVisible=p>0.04&&p<0.7; // visible from dawn to twilight
  const sunX=W/2+Math.cos(sunAngle)*W*0.42;
  const sunY=100-Math.sin(sunAngle)*70+(p>0.5?(p-0.5)*120:0); // arc + dip at sunset
  return{top,mid,bot,cloudAlpha:ca,waveColor:wc,sunVisible,sunX,sunY};
}

// ===== DIFFICULTY SYSTEM =====
function getDiffLevel(gameTime){return Math.floor(gameTime/120)} // level up every 2 min
function getDiffMultiplier(gameTime){return 1+getDiffLevel(gameTime)*0.06} // +6% per level

  update(dt){
    if(this.state===ST.MENU||this.state===ST.LOADING||this.state===ST.INTRO||this.state===ST.SCORES||this.state===ST.HELP)return;
    this.dt=dt;

      this.camera.x+=(this.player.x-this.camera.x)*0.1;this.camera.y+=(this.player.depth-this.camera.y)*0.08;
      // Sonar pings
      for(let i=this.sonarPings.length-1;i>=0;i--){const p=this.sonarPings[i];p.radius+=p.speed*dt;p.alpha-=dt*0.8;if(p.alpha<=0){this.sonarPings.splice(i,1);continue}
        for(const e of this.enemies){const dx=e.x-p.x,dy=e.y-p.y;if(Math.abs(Math.sqrt(dx*dx+dy*dy)-p.radius)<12){e.sonarMarked=true;e.markedTimer=180}}}
      // Torpedoes

          if(hit)continue;
          const sf=this.sfDepth(t.x);if(t.y>=sf){this.explosions.push({x:t.x,y:t.y,radius:3,maxR:14,alpha:1});this.torpedoes.splice(i,1);}
        }
        // Enemy torpedoes: check against player
        if(t.type==='enemy'){
          const dx=this.player.x-t.x,dy=this.player.depth-t.y;const pdist=Math.sqrt(dx*dx+dy*dy);
          if(pdist<14){
            this.explosions.push({x:t.x,y:t.y,radius:10,maxR:38,alpha:1});sfxExp();
            const armDmg=25+Math.random()*25;const stressDmg=15+Math.random()*20;
            this.player.armorIntegrity-=armDmg;this.player.hullStress+=stressDmg;
            this.msg(`!!! 被敌方鱼雷命中！装甲-${Math.round(armDmg)}% 压力+${Math.round(stressDmg)}%`);
            this.torpedoes.splice(i,1);
          }
        }
      }
      // Depth charges
      for(let i=this.depthCharges.length-1;i>=0;i--){const dc=this.depthCharges[i];dc.y+=dc.speed*dt;dc.life-=dt;const dx=this.player.x-dc.x,dy=this.player.depth-dc.y;const dist=Math.sqrt(dx*dx+dy*dy);const atTgt=dc.targetY&&dc.y>=dc.targetY;if(dc.life<=0||dc.y>=WH||atTgt||dist<dc.explodeRadius){const close=dist<dc.explodeRadius;this.explosions.push({x:dc.x,y:dc.y,radius:close?10:5,maxR:close?38:22,alpha:1});sfxExp();if(close){const dmg=dc.damage*(1-dist/dc.explodeRadius);this.player.armorIntegrity-=dmg*15;this.player.hullStress+=dmg*20;this.msg(`!!! 深水炸弹爆炸！距离${Math.round(dist)}米`)}this.depthCharges.splice(i,1)}}
      // Explosions
      for(let i=this.explosions.length-1;i>=0;i--){const ex=this.explosions[i];ex.radius+=(ex.maxR-ex.radius)*0.1;ex.alpha-=dt*1.5;if(ex.alpha<=0)this.explosions.splice(i,1)}
      // Enemies
      for(const e of this.enemies)e.update(dt,this);
      // Wrecks
      for(const w of this.wrecks){if(w.timer>0)w.timer-=dt;if(w.looted)continue;const dx=this.player.x-w.x,dy=this.player.depth-w.depth;const wasNear=w.nearPlayer;w.nearPlayer=Math.sqrt(dx*dx+dy*dy)<30&&w.timer<=0;if(w.nearPlayer&&!wasNear){this.msg(`发现${w.type==='destroyer'?'驱逐舰':w.type==='submarine'?'潜艇':'商船'}残骸！按2或点击大白鲨小组可搜索`)}}
      // Message timers
      for(let i=this.messageLog.length-1;i>=0;i--){this.messageLog[i].timer-=dt;if(this.messageLog[i].timer<=0)this.messageLog.splice(i,1)}
      for(let i=this.alertMessages.length-1;i>=0;i--){this.alertMessages[i].timer-=dt;if(this.alertMessages[i].timer<=0)this.alertMessages.splice(i,1)}
      // Surface danger
      this.surfaceDanger=this.player.depth<30?Math.max(0,1-this.player.depth/30):0;
      // Breach
      if(this.breaching){this.breachProgress+=dt/8;if(this.breachProgress>=1){this.breachProgress=0;this.breaching=false;this.player.oxygen=100;this.msg('氧气补充完毕！')}}
      // Battery swap
      if(this.batterySwapping){this.batterySwapProgress+=dt/15;if(this.batterySwapProgress>=1){this.batterySwapProgress=0;this.batterySwapping=false;if(this.player.batteries>0){this.player.batteries--;this.player.power=100;this.msg('电池更换完毕！')}}}
      // Events
      this.eventCooldown-=dt;if(this.eventCooldown<=0&&!this.activeEvent){this.checkEvents()}
      // === ENEMY SPAWN SYSTEM ===
      this.enemySpawnTimer-=dt;
      if(this.enemySpawnTimer<=0){
        // Surface: many more enemies (patrols spot you)
        if(this.player.depth<15){this.spawnEnemy('destroyer');if(Math.random()<0.4)this.spawnEnemy('destroyer')}
        else if(this.player.depth<40){this.spawnRandomEnemy();if(Math.random()<0.2)this.spawnEnemy('merchant')}
        else{this.spawnRandomEnemy()}
        const dspd=Math.max(0.4,1-getDiffLevel(this.gameTime)*0.04);
        this.enemySpawnTimer=((this.player.depth<15)?(14+Math.random()*22):(this.player.depth<40)?(25+Math.random()*36):(35+Math.random()*50))*dspd;
      }
      // Surface danger: patrol aircraft spot you
      if(this.player.depth<5&&Math.random()<0.008*dt){this.spawnEnemy('destroyer');this.alert('!!! 巡逻机发现水面航行的潜艇！驱逐舰出动！',true);this.msg('警告：在水面停留过久！')}
      // Surface: enemies detect you and converge
      if(this.player.depth<25){for(const e of this.enemies){if(e.type==='destroyer'&&!e.sonarMarked&&Math.sqrt((e.x-this.player.x)**2+(e.y-this.player.depth)**2)<350){e.sonarMarked=true;e.markedTimer=600}}}
      // Submarine ambush
      if(Math.random()<0.001*dt&&this.player.depth>20){const amb=this.spawnEnemy('submarine');amb.x=this.player.x+(Math.random()>0.5?1:-1)*(50+Math.random()*50);amb.y=this.player.depth+(Math.random()-0.5)*40;amb.ambush=true;this.alert('!!! 被动声呐：近距离螺旋桨噪音！',true);this.msg('警告！敌方潜艇正在逼近！')}
      // === KILL STREAK ===
      if(this._lastKillTime&&this.gameTime-this._lastKillTime>60)this._killStreak=0;
      // === CONVOY TRAFFIC ===
      if(Math.random()<0.003*dt){this.spawnEnemy('merchant',800+Math.random()*(WW-1600),0)}
      // === DIFFICULTY LEVEL UP ===
      const newDL=getDiffLevel(this.gameTime);if(newDL>0&&newDL!==this._lastDL){this._lastDL=newDL;this.msg(`⚠ 难度提升！Lv.${newDL} — 敌人更强、更频繁`);if(newDL%3===0)this.alert(`深度警戒！难度已达 Lv.${newDL}`,true)}

    }

    updateBubbles(dt);
    // Spawn bubbles near player
    if(Math.random()<0.3&&this.state===ST.PLAY)spawnBubbles(this.player.x,this.player.depth,1);
  }

  spawnRandomEnemy(){const types=['destroyer','submarine','submarine','merchant','merchant','merchant','merchant','merchant','merchant','merchant','merchant','merchant','merchant','cruiser'];const t=types[Math.floor(Math.random()*types.length)];const e=this.spawnEnemy(t);
    // Escort cruiser for merchants (35% chance)
    if(t==='merchant'&&Math.random()<0.35){const esc=this.spawnEnemy('cruiser',e.x+40+Math.random()*80,0);esc.escortTarget=e;esc.vx=e.vx}
    // Maintain cruiser count near ports
    const usCruisers=this.enemies.filter(e=>e.type==='cruiser'&&e.x<600).length;
    const ukCruisers=this.enemies.filter(e=>e.type==='cruiser'&&e.x>WW-600).length;
    if(usCruisers<3&&Math.random()<0.2)this.spawnEnemy('cruiser',200+Math.random()*400,0);
    if(ukCruisers<3&&Math.random()<0.2)this.spawnEnemy('cruiser',WW-600+Math.random()*400,0);
  }

  checkEvents(){
    const d=this.player.depth,evs=[];

  checkGO(){if(this.player.oxygen<=0)this.endGame('氧气耗尽！全体船员窒息身亡...');else if(this.player.hullStress>=100)this.endGame('船体压力过大！潜艇被水压碾碎...');else if(this.player.armorIntegrity<=0)this.endGame('船体完全解体！铁十字号沉入深海...')}
  endGame(r){this.state=ST.OVER;this.gameOverReason=r;this.gameOverTimer=1.5;svS('指挥官',this.score);this.highScores=ldS();this.msg('=== 游戏结束 ===');this.msg(r);this.msg(`最终得分: ${this.score}`)}

  killEnemy(e,i){
    let pts=0;switch(e.type){case'cruiser':pts=1200;break;case'destroyer':pts=800;break;case'submarine':pts=500;break;case'merchant':pts=500;break}
    this._totalKills++;this._killStreak=(this._killStreak||0)+1;this._lastKillTime=this.gameTime;
    if(this._killStreak>=3){pts=Math.floor(pts*(1+this._killStreak*0.25));this.msg(`🔥 ${this._killStreak}连杀！得分x${(1+this._killStreak*0.25).toFixed(1)}`)};
    if(this._killStreak===5)this.msg('🏅 王牌指挥官！5连杀成就！');
    if(this._killStreak===10)this.msg('👑 深海猎手！10连杀成就！');
    if(this._totalKills===1)this.msg('🎖 首杀！铁十字号的第一个战果！');
    this.score+=pts;
    const typeName=e.type==='cruiser'?'巡洋舰':e.type==='destroyer'?'驱逐舰':e.type==='submarine'?'敌方潜艇':'商船';
    this.msg(`击沉${typeName}！+${pts}分`);
    this.wrecks.push({x:e.x,y:e.y,depth:e.y,type:e.type,timer:45,nearPlayer:false,looted:false,
      loot:{torpedoes:1+Math.floor(Math.random()*4),power:25+Math.random()*40,cruiseTorps:Math.random()<0.3?1:0,missile:Math.random()<0.15?1:0}});
    this.explosions.push({x:e.x,y:e.y,radius:8,maxR:42,alpha:1});this.enemies.splice(i,1);
    spawnBubbles(e.x,e.y,15);
    // Merchant attacked: escort cruiser or nearby warships respond
    if(e.type==='merchant'){
      // Escort responds immediately
      for(const en of this.enemies){if(en.type==='cruiser'&&en.escortTarget===e){en.sonarMarked=true;en.markedTimer=600;en.vx=Math.sign(this.player.x-en.x)*en.speed;this.msg('商船的护航巡洋舰急速赶来！');break}}
      setTimeout(()=>{if(this.state===ST.PLAY){this.spawnEnemy('destroyer',e.x+100,0);this.msg('港口的驱逐舰赶来增援！')}},4000);
    }
    if(e.type==='cruiser'&&Math.random()<0.4)setTimeout(()=>{if(this.state===ST.PLAY){this.spawnEnemy('destroyer',e.x+80,0);this.msg('巡洋舰的求救信号引来了增援！')}},5000);
    if(e.type==='destroyer'&&Math.random()<0.2)setTimeout(()=>{if(this.state===ST.PLAY){this.spawnEnemy('destroyer',e.x+100,0);this.msg('驱逐舰的求救信号引来了友军舰艇！')}},7000);
  }

  fireTorp(target,type='normal'){
    if(this.batterySwapping){this.msg('正在更换电池，无法发射！');return}
    if(type==='missile'&&target.y>0){this.msg('导弹只能攻击水面舰艇！');return}
    const avail=type==='normal'?this.player.normalTorps:type==='cruise'?this.player.cruiseTorps:this.player.missiles;
    if(avail<=0){this.msg(`${type==='normal'?'普通鱼雷':type==='cruise'?'巡航鱼雷':'导弹'}已耗尽！`);return}
    let hitChance=1;
    if(type==='normal'){const dist=Math.sqrt((target.x-this.player.x)**2+(target.y-this.player.depth)**2);hitChance=0.4+0.4*Math.max(0,1-dist/250)}
    else if(type==='cruise'){hitChance=0.85}
    else if(type==='missile'){hitChance=0.9}
    const dmg=type==='normal'?35:type==='cruise'?55:85;
    if(type==='normal')this.player.normalTorps--;else if(type==='cruise')this.player.cruiseTorps--;else this.player.missiles--;
    this.player.power-=type==='missile'?10:type==='cruise'?7:5;
    const ang=Math.atan2(target.y-this.player.depth,target.x-this.player.x);const spd=type==='cruise'?280:type==='missile'?350:200;
    this.torpedoes.push({x:this.player.x,y:this.player.depth,angle:ang,speed:spd,life:10,damage:dmg,type,hitChance});sfxTorp();
    this.msg(`发射${type==='normal'?'普通鱼雷':type==='cruise'?'巡航鱼雷':'导弹'}！命中:${Math.round(hitChance*100)}% 伤害:${dmg}`);
    if(hitChance<1){const t=this.torpedoes[this.torpedoes.length-1];setTimeout(()=>{const idx=this.torpedoes.indexOf(t);if(idx>=0){this.torpedoes.splice(idx,1);const mx=this.player.x+Math.cos(ang)*150,my=this.player.depth+Math.sin(ang)*150;this.explosions.push({x:mx,y:Math.max(0,my),radius:3,maxR:12,alpha:1});this.msg('鱼雷未命中目标！')}},2000)}
  }

  // ===== RENDER =====
  render(){
    cx.fillStyle='#000';cx.fillRect(0,0,W,H);
    switch(this.state){
      case ST.MENU:this.rMenu();break;case ST.LOADING:this.rLoading();break;case ST.INTRO:this.rIntro();break;
      case ST.PLAY:case ST.PAUSE:case ST.CREW:case ST.EVENT:this.rGame();break;
      case ST.OVER:this.rOver();break;case ST.SCORES:this.rScores();break;case ST.HELP:this.rHelp();break;
    }
    if(this.state===ST.PAUSE)this.rPause();
    if(this.state===ST.CREW)this.rCrew();
    if(this.state===ST.EVENT)this.rEvent();
  }

  rMenu(){
    // Deep ocean gradient
    const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020c18');g.addColorStop(0.25,'#06182c');g.addColorStop(0.6,'#030e1a');g.addColorStop(1,'#010408');cx.fillStyle=g;cx.fillRect(0,0,W,H);

    // === SKY (day cycle) ===
    const dp=dayPhase(this._dayT||0);
    const skyG=cx.createLinearGradient(0,0,0,190);skyG.addColorStop(0,dp.top);skyG.addColorStop(0.5,dp.mid);skyG.addColorStop(1,dp.bot);cx.fillStyle=skyG;cx.fillRect(0,0,W,190);
    // Sun
    if(dp.sunVisible){
      const sunG=cx.createRadialGradient(dp.sunX,dp.sunY,6,dp.sunX,dp.sunY,70);
      sunG.addColorStop(0,'rgba(255,250,220,0.95)');sunG.addColorStop(0.1,'rgba(255,240,180,0.6)');sunG.addColorStop(0.4,'rgba(255,200,100,0.15)');sunG.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=sunG;cx.fillRect(dp.sunX-70,dp.sunY-70,140,140);
      cx.fillStyle='#fffde8';cx.beginPath();cx.arc(dp.sunX,dp.sunY,8,0,Math.PI*2);cx.fill();
    }
    // Clouds (fade at night)
    cx.globalAlpha=dp.cloudAlpha;
    for(let c=0;c<5;c++){
      const cwx=((70+c*195+this.gameTime*0.6)%(W+140))-70,cwy=18+c*26;
      cx.fillStyle='rgba(255,255,255,0.7)';cx.beginPath();cx.arc(cwx,cwy,19,0,Math.PI*2);cx.fill();
      cx.fillStyle='rgba(255,255,255,0.5)';cx.beginPath();cx.arc(cwx+22,cwy-2,13,0,Math.PI*2);cx.fill();
      cx.fillStyle='rgba(255,255,255,0.55)';cx.beginPath();cx.arc(cwx-14,cwy+3,15,0,Math.PI*2);cx.fill();
    }
    // Moon + stars at night
    if(dp.cloudAlpha<0.3){
      const na=(0.3-dp.cloudAlpha)*3;
      // Moon
      cx.globalAlpha=na;const mx=W*0.75,my=40;const moonGlow=cx.createRadialGradient(mx,my,4,mx,my,40);moonGlow.addColorStop(0,'rgba(255,250,220,0.9)');moonGlow.addColorStop(0.3,'rgba(255,250,220,0.3)');moonGlow.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=moonGlow;cx.fillRect(mx-40,my-40,80,80);cx.fillStyle='#fffde8';cx.beginPath();cx.arc(mx,my,7,0,Math.PI*2);cx.fill();
      // Moon reflection on water
      for(let r=0;r<5;r++){cx.fillStyle=`rgba(255,250,220,${0.15-r*0.03})`;cx.fillRect(mx-8+r*2,112+r*3,16-r*3,1.5)}
      // Stars
      for(let s=0;s<25;s++){const sx=(s*173+40)%W,sy=(s*97+15)%95;R.r(sx,sy,1,1,'rgba(255,255,255,0.7)')}
    }
    cx.globalAlpha=1;
    // === OCEAN SURFACE ===
    for(let i=0;i<W;i+=8){const wy=112+Math.sin(i*0.01+this.gameTime*0.01)*8+Math.sin(i*0.03+this.gameTime*0.016)*5;R.r(i,wy-1,7,3,dp.waveColor)}
    for(let i=0;i<W;i+=22){const sy=110+Math.sin(i*0.018+this.gameTime*0.022)*7;cx.fillStyle='rgba(70,140,210,0.12)';cx.fillRect(i,sy-1,16,1.5)}

    // Plankton particles
    for(let i=0;i<45;i++){
      const px=((i*143+this.gameTime*8)%(W+100))-50,py=160+((i*89+Math.sin(this.gameTime*0.2+i*2.5)*40)%(H-160));
      R.bub(px,py,0.5+Math.random()*1.2,0.08+Math.sin(this.gameTime*0.4+i)*0.05);
    }

    // Submarine silhouette (larger, center-right)
    cx.save();cx.globalAlpha=0.28;
    const subX=W*0.58+Math.sin(this.gameTime*0.12)*20,subY=370+Math.sin(this.gameTime*0.1)*12;
    R.sub(subX,subY,-1);
    for(let i=0;i<10;i++){const bx=subX+30+i*7+Math.sin(this.gameTime*2+i)*4,by=subY-2+Math.random()*6;R.bub(bx,by,0.4+Math.random()*0.9,0.1)}
    cx.restore();

// ===== SUBMARINE CLASS =====
class Sub{
  constructor(){
    this.x=0;this.depth=15;this.vy=0;this.vx=0;this.direction=1;this.turnProgress=0;this.turning=false;
    this.oxygen=100;this.power=100;this.hullStress=0;this.armorIntegrity=100;this.batteries=3;this.morale=80;
    this.normalTorps=20;this.cruiseTorps=10;this.missiles=5;this.spotlight=true;
    this.oxygenRate=0.055;this.powerDrainRate=0.035;this.maxSpeed=60;this.verticalSpeed=25;
  }
  update(dt,game){
    // Turning
    if(K['a']&&!this.turning&&this.direction===1){this.turning=true;this.turnProgress=0}
    if(K['d']&&!this.turning&&this.direction===-1){this.turning=true;this.turnProgress=0}
    if(this.turning){this.turnProgress+=dt/2;if(this.turnProgress>=1){this.turning=false;this.direction*=-1;game.msg(`转向完成！航向: ${this.direction>0?'右':'左'}`)}}
    // Horizontal
    const mvK=this.direction>0?'d':'a',rvK=this.direction>0?'a':'d';
    if(K[mvK]&&!this.turning)this.vx+=(this.maxSpeed-this.vx)*0.05;
    else if(K[rvK]&&!this.turning){this.vx-=this.vx*0.2;this.vx-=5}
    else this.vx*=0.98;
    this.vx=Math.max(-20,Math.min(this.maxSpeed,this.vx));this.x+=this.vx*this.direction*dt;this.x=Math.max(10,Math.min(WW-10,this.x));
    // Vertical
    if(K['w']&&!this.turning&&!game.breaching)this.vy-=this.verticalSpeed*0.3*dt*60;
    if(K['s']&&!this.turning&&!game.breaching)this.vy+=this.verticalSpeed*0.3*dt*60;
    this.vy*=0.95;this.depth+=this.vy*dt;this.depth=Math.max(0,Math.min(285,this.depth));
    if(this.depth<=0){this.depth=0;this.vy=0}const sf=game.sfDepth(this.x);if(this.depth>=sf-3){this.depth=sf-3;this.vy=0}
    // Resources
    this.oxygen-=this.oxygenRate*dt*(1+this.depth*0.005);this.oxygen=Math.max(0,this.oxygen);
    this.power-=this.powerDrainRate*dt*(1+Math.abs(this.vx)/this.maxSpeed);this.power-=this.spotlight&&this.depth>DS?0.02*dt:0;this.power=Math.max(0,this.power);
    if(this.depth>0){const ts=this.depth/WH*100;this.hullStress+=(ts-this.hullStress)*0.01*dt;if(this.depth<30)this.hullStress=Math.max(0,this.hullStress-0.5*dt)}this.hullStress=Math.max(0,Math.min(100,this.hullStress));
    if(this.armorIntegrity<100&&!game.breaching&&!game.batterySwapping)this.armorIntegrity+=0.015*dt;
    if(this.depth<=0.5&&this.oxygen<90&&!game.breaching){game.breaching=true;game.breachProgress=0;game.msg('正在水面换气...注意巡逻机！')}
    if(this.depth<20&&Math.random()<0.0008*dt&&Math.random()<0.3){game.spawnEnemy('destroyer');game.alert('!!! 巡逻机发现你了！驱逐舰正在接近！',true)}
    // Passive sonar
    for(const e of game.enemies){if(e.sonarMarked)continue;const dist=Math.sqrt((e.x-this.x)**2+(e.y-this.depth)**2);const dr=e.type==='destroyer'?130:e.type==='submarine'?90:110;if(dist<dr&&Math.random()<0.012*dt){const tn=e.type==='destroyer'?'水面战舰':e.type==='submarine'?'水下目标':'商船';game.alert(`被动声呐：检测到${tn}螺旋桨，约${Math.round(dist)}米`,e.type==='destroyer')}}
  }
  repairArmor(amt=20){if(this.power<15)return'电力不足！';this.power-=15;this.armorIntegrity=Math.min(100,this.armorIntegrity+amt);return`装甲修复完成！+${amt}%`}
  swapBattery(){if(this.batteries<=0)return'没有备用电池！';this.batteries--;this.power=100;return'电池更换完成！'}
  toggleSpotlight(){this.spotlight=!this.spotlight;return this.spotlight?'探照灯已开启':'探照灯已关闭'}
  activeSonar(game){if(this.power<8)return'电力不足！';this.power-=8;game.sonarPings.push({x:this.x,y:this.depth,radius:5,speed:150,alpha:1});sfxSonar();game.msg('主动声呐脉冲已发出！');return'声呐扫描中...'}
}

// ===== ENEMY CLASS =====
class Enemy{
  constructor(type,x,y,game){
    this.type=type;this.x=x;this.y=y;this.vx=0;this.vy=0;this.sonarMarked=false;this.markedTimer=0;this.aiTimer=0;this.aiState='patrol';this.dcCD=0;this.torpCD=0;this.ambush=false;
    const dm=game?getDiffMultiplier(game.gameTime):1;
    switch(type){case'cruiser':this.hp=Math.floor(150*dm);this.maxHp=this.hp;this.speed=(16+Math.random()*8)*Math.min(1.4,1+(dm-1)*0.4);this.y=0;this.escortTarget=null;break;case'destroyer':this.hp=Math.floor(90*dm);this.maxHp=this.hp;this.speed=(18+Math.random()*10)*Math.min(1.5,1+(dm-1)*0.5);this.y=0;break;case'submarine':this.hp=Math.floor(55*dm);this.maxHp=this.hp;this.speed=(14+Math.random()*16)*Math.min(1.5,1+(dm-1)*0.5);break;case'merchant':this.hp=Math.floor(40*dm);this.maxHp=this.hp;this.speed=(8+Math.random()*10)*Math.min(1.3,1+(dm-1)*0.3);this.y=0;this.escortedBy=null;break}
  }
  update(dt,game){
    if(this.markedTimer>0){this.markedTimer-=dt;if(this.markedTimer<=0)this.sonarMarked=false}
    this.dcCD-=dt;this.torpCD-=dt;
    const dx=game.player.x-this.x,dy=game.player.depth-this.y,dist=Math.sqrt(dx*dx+dy*dy);
    const hDist=Math.abs(dx); // horizontal distance only
    this.aiTimer-=dt;if(this.aiTimer<=0){this.aiTimer=1.5+Math.random()*3;this.ai(dist,dx,dy,hDist,game)}
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.y=Math.max(0,Math.min(game.sfDepth(this.x)-8,this.y));
    if(this.x<0)this.x=WW;if(this.x>WW)this.x=0;
    // Warship attacks — only if detected or player exposed
    const exposed=game.player.depth<30; // visible from surface
    const detected=this.sonarMarked||exposed||dist<70; // need detection to attack
    // Escort: cruiser follows its merchant
    if(this.type==='cruiser'&&this.escortTarget&&this.escortTarget.hp>0){this.vx=this.escortTarget.vx;this.x+=this.vx*dt;this.y=0;return}
    if((this.type==='destroyer'||this.type==='cruiser')){
      if(detected&&dist<150&&game.player.depth>3&&game.player.depth<100&&this.dcCD<=0){this.dropDC(game);this.dcCD=this.type==='cruiser'?4+Math.random()*5:5+Math.random()*7}
      if(detected&&hDist<250&&this.torpCD<=0&&game.player.depth>5){this.fireTorp(game);this.torpCD=this.type==='cruiser'?6+Math.random()*10:10+Math.random()*14;game.alert(`!!! ${this.type==='cruiser'?'巡洋舰':'驱逐舰'}发射鱼雷！`,true)}
      if(detected&&game.player.depth>100&&hDist<180){this.vx=Math.sign(dx)*this.speed*0.7;this.aiState='circling'}
    }
    if(this.type==='submarine'&&(this.sonarMarked||dist<90)&&dist<200&&this.torpCD<=0){this.fireTorp(game);this.torpCD=5+Math.random()*9}
  }
  ai(dist,dx,dy,hDist,game){
    const exposed=game.player.depth<30;
    const detected=this.sonarMarked||exposed||dist<70;
    switch(this.type){case'cruiser':case'destroyer':
      if(detected&&game.player.depth>100&&hDist<180){this.vx=Math.sign(dx)*this.speed*0.7;this.aiState='circling'}
      else if(detected&&dist<350){this.vx=Math.sign(dx)*this.speed*0.95;this.aiState='chase'}
      else{this.vx=(Math.random()-0.5)*this.speed*0.5;this.aiState='patrol'}break;
      case'submarine':
        if(dist<70&&this.sonarMarked){this.vx=-Math.sign(dx)*this.speed*0.5;this.vy=-Math.sign(dy)*8;this.aiState='flee'}
        else if(dist<280&&(this.sonarMarked||dist<110)){this.vx=Math.sign(dx)*this.speed*0.55;this.vy=Math.sign(dy)*5;this.aiState='hunt'}
        else{this.vx=(Math.random()-0.5)*this.speed*0.4;this.vy=(Math.random()-0.5)*8;this.aiState='patrol'}
        break;
      case'merchant':
        if(this.x<WW/2)this.vx=this.speed*0.6;
        else this.vx=-this.speed*0.6;
        this.aiState='sail';break}
  }
  dropDC(game){const ty=Math.min(game.player.depth,90)+(Math.random()-0.5)*12;const dmg=this.type==='cruiser'?35+Math.random()*35:25+Math.random()*30;game.depthCharges.push({x:this.x+(Math.random()-0.5)*6,y:2,speed:45+Math.random()*18,life:22,damage:dmg,explodeRadius:25+Math.random()*20,targetY:ty})}
  fireTorp(game){const ang=Math.atan2(game.player.depth-this.y,game.player.x-this.x);const dmg=this.type==='cruiser'?50:this.type==='destroyer'?35:45;const spd=this.type==='cruiser'?170:this.type==='destroyer'?150:140;game.torpedoes.push({x:this.x,y:this.y,angle:ang,speed:spd,life:14,damage:dmg,type:'enemy',hitChance:this.type==='cruiser'?0.5:this.type==='destroyer'?0.38:0.48});if(this.type==='submarine')game.alert('!!! 敌方潜艇发射鱼雷！',true)}
}

// ===== MAIN =====
const game=new Game();let lastTime=performance.now();

function gameLoop(ts){
  let dt=(ts-lastTime)/1000;lastTime=ts;if(dt>0.1)dt=0.1;if(dt<=0)dt=0.016;
  if(game.state===ST.LOADING){game.loadTimer-=dt;if(game.loadTimer<=0)game.state=ST.INTRO}
  if(game.state!==ST.MENU&&game.state!==ST.LOADING&&game.state!==ST.INTRO)game.gameTime+=dt;
  game._dayT=(game._dayT||0)+dt;if(game._dayT>=300)game._dayT-=300;
  handleInput(dt);game.update(dt);game.render();M.clicked=false;requestAnimationFrame(gameLoop);
}

function startPlaying(){game.state=ST.PLAY;game.msg('=== 任务开始 ===');game.msg('铁十字号潜入北大西洋...');
  game.spawnEnemy('merchant');game.spawnEnemy('merchant');game.spawnEnemy('merchant');
  for(let i=0;i<5;i++){game.spawnEnemy('cruiser',300+Math.random()*300,0);game.spawnEnemy('cruiser',WW-600+Math.random()*300,0)}
  setTimeout(()=>{if(game.state===ST.PLAY){game.spawnEnemy('destroyer');game.spawnEnemy('destroyer')}},5000);
  setTimeout(()=>{if(game.state===ST.PLAY)game.spawnEnemy('submarine')},12000);
  setTimeout(()=>{if(game.state===ST.PLAY)game.spawnEnemy('submarine')},20000);
}
function openCrew(i){game.crewPanel.team=i;game.state=ST.CREW;sfxSel()}
function execAction(ti,ai){
  const p=game.player;
  switch(ti){
    case 0:if(ai===0){const r=p.repairArmor(20);game.msg(`[猎鹰小组] ${r}`);sfxSel()}break;
    case 1:if(ai===0){let found=false;
      // Search nearby wrecks
      for(const w of game.wrecks){if(w.nearPlayer&&!w.looted){w.looted=true;
        const intelRoll=Math.random();
        let intelMsg='';
        if(intelRoll<0.35){// 35% chance: intel reveals nearby enemies
          for(const e of game.enemies){if(!e.sonarMarked){e.sonarMarked=true;e.markedTimer=300;intelMsg=' | 情报: 发现敌方单位位置！'}}
          if(!intelMsg)intelMsg=' | 未发现额外情报';
        }else if(intelRoll<0.55){// 20% chance: score bonus from documents
          game.score+=150;intelMsg=' | 情报: 缴获机密文件！+150分';
        }else if(intelRoll<0.7){// 15% chance: find extra supplies
          p.normalTorps+=2;p.power=Math.min(100,p.power+20);intelMsg=' | 情报: 发现隐藏物资舱！+2鱼雷 +20%电力';
        }
        p.normalTorps+=w.loot.torpedoes;p.power=Math.min(100,p.power+w.loot.power);
        if(w.loot.cruiseTorps)p.cruiseTorps+=w.loot.cruiseTorps;
        if(w.loot.missile)p.missiles+=w.loot.missile;
        let lootStr=`+${w.loot.torpedoes}鱼雷 +${Math.round(w.loot.power)}%电力`;
        if(w.loot.cruiseTorps)lootStr+=` +${w.loot.cruiseTorps}巡航鱼雷`;
        if(w.loot.missile)lootStr+=` +${w.loot.missile}导弹`;
        game.msg(`[大白鲨小组] 搜索沉船！${lootStr}${intelMsg}`);
        found=true;sfxSel();break;
      }}
      // If no wreck nearby, try intelligence sweep (30% chance to find something)
      if(!found&&Math.random()<0.3){
        const intelTypes=['盟军护航队航线图','德军情报站加密电报','敌方潜艇巡逻时间表','气象预报与海流图','盟军港口防御部署'];
        const intel=intelTypes[Math.floor(Math.random()*intelTypes.length)];
        game.score+=80+Math.floor(Math.random()*100);
        game.msg(`[大白鲨小组] 情报搜集：获得「${intel}」！+${80+Math.floor(Math.random()*100)}分`);
        // Possibly mark nearby enemies
        if(Math.random()<0.4)for(const e of game.enemies){if(!e.sonarMarked&&Math.random()<0.5){e.sonarMarked=true;e.markedTimer=240}}
        sfxSel();
      }else if(!found)game.msg('[大白鲨小组] 附近无可搜索目标，情报扫描未发现异常');
    }break;
    case 2:if(ai===0){if(p.batteries>0&&p.power<90){game.batterySwapping=true;game.batterySwapProgress=0;game.msg('[巨鲸小组] 开始更换电池...');sfxSel()}else if(p.batteries<=0)game.msg('[巨鲸小组] 没有备用电池！');else game.msg('[巨鲸小组] 电力充足')}else if(ai===1){game.msg(`[状态] O₂:${Math.round(p.oxygen)}% 电力:${Math.round(p.power)}% 压力:${Math.round(p.hullStress)}% 装甲:${Math.round(p.armorIntegrity)}%`);game.msg(`电池:${p.batteries} 士气:${Math.round(p.morale)}% 普通鱼雷:${p.normalTorps} 巡航:${p.cruiseTorps} 导弹:${p.missiles}`);game.state=ST.PLAY}break;
    case 3:if(ai===0){const r=p.toggleSpotlight();game.msg(`[北冰洋小组] ${r}`);sfxSel()}else if(ai===1){const r=p.activeSonar(game);game.msg(`[北冰洋小组] ${r}`);game.state=ST.PLAY}break;
    case 4:if(ai<=2){game.msg('[雷霆小组] 请在游戏画面中点击目标敌舰...');game.state=ST.PLAY;game._pendingAttack=ai;sfxSel()}break;
  }
}

function handleInput(dt){
  switch(game.state){
    case ST.MENU:
      if(K['w']&&!K._wp){game.menuSel=(game.menuSel-1+4)%4;sfxClick()}if(K['s']&&!K._sp){game.menuSel=(game.menuSel+1)%4;sfxClick()}
      if(K['enter']||K[' ']){ia();sfxSel();menuSelect()}
      if(M.clicked){ia();sfxSel();
        // Check volume buttons
        if(game._volRects)for(const vr of game._volRects){if(M.x>=vr.x&&M.x<=vr.x+vr.w&&M.y>=vr.y&&M.y<=vr.y+vr.h){if(vr.act==='up')setBGMVolume(bgmVolume+0.1);else if(vr.act==='down')setBGMVolume(bgmVolume-0.1);else toggleBGM();return}}
        menuSelect()}break;
    case ST.INTRO:
      // Skip: ESC key or click skip button
      const skx=W-120,sky=15,skw=105,skh=28;
      const skClicked=M.clicked&&M.y>=sky&&M.y<=sky+skh&&M.x>=skx&&M.x<=skx+skw;
      if(K['escape']||skClicked){game.introPhase=game.introTexts.length;sfxClick()}
      if(M.clicked||K['enter']||K[' ']){game.introPhase++;game.introTimer=0;sfxClick();if(game.introPhase>=game.introTexts.length){startPlaying()}}game.introTimer+=dt;break;
    case ST.PLAY:
      if(K['1']&&!K._1p)openCrew(0);if(K['2']&&!K._2p)openCrew(1);if(K['3']&&!K._3p)openCrew(2);if(K['4']&&!K._4p)openCrew(3);if(K['5']&&!K._5p)openCrew(4);
      if(K[' ']&&!K._spacep)game.player.activeSonar(game);
      if(K['s']&&game.breaching){game.breaching=false;game.breachProgress=0;game.player.oxygen=Math.max(0,Math.min(100,game.player.oxygen+40));game.msg('换气中断！已补充40%氧气')}
      if(K['escape']&&!K._escp){game.state=ST.PAUSE;game.msg('游戏暂停 - 按ESC继续')}else if(K['p']&&!K._pp){game.state=ST.PAUSE;game.msg('游戏暂停 - 按P继续')}
      if(M.clicked&&!game.batterySwapping)handleClick();
      break;
    case ST.PAUSE:
      if((K['escape']&&!K._escp)||(K['p']&&!K._pp)){game.state=ST.PLAY;game.msg('游戏继续')}
      if(K['m']&&!K._mp){game.state=ST.MENU;game.menuSel=0}break;
    case ST.CREW:
      if(K['1']&&!K._1p){K._1p=true;execAction(game.crewPanel.team,0)}
      if(K['2']&&!K._2p){K._2p=true;execAction(game.crewPanel.team,1)}
      if(K['3']&&!K._3p){K._3p=true;execAction(game.crewPanel.team,2)}
      if(K['4']&&!K._4p){K._4p=true;game.crewPanel.team=3}
      if(K['5']&&!K._5p){K._5p=true;game.crewPanel.team=4}
      if(K['escape']&&!K._escp){game.state=ST.PLAY;game._crewBtnHover=-1}
      if(M.clicked){handleCrewClick()}break;
    case ST.EVENT:
      if(M.clicked)handleEventClick();break;
    case ST.OVER:
      game.gameOverTimer-=dt;if((M.clicked||K['enter']||K[' '])&&game.gameOverTimer<0){game.state=ST.MENU;game.menuSel=0}break;
    case ST.SCORES:case ST.HELP:
      if(M.clicked||K['escape']||K['enter']||K[' ']){game.state=ST.MENU;game.menuSel=game.state===ST.SCORES?1:2}break;
  }
  K._wp=K['w'];K._sp=K['s'];K._1p=K['1'];K._2p=K['2'];K._3p=K['3'];K._4p=K['4'];K._5p=K['5'];K._spacep=K[' '];K._escp=K['escape'];K._pp=K['p'];K._mp=K['m'];
}

function menuSelect(){switch(game.menuSel){case 0:game.startGame();break;case 1:game.state=ST.SCORES;game.highScores=ldS();break;case 2:game.state=ST.HELP;break;case 3:window.close();break}}

function handleClick(){
  const cx0=game.camera.x,cy0=game.camera.y;
  // 1. Check crew buttons at bottom
  if(game._crewBtnRects){for(const br of game._crewBtnRects){if(M.x>=br.x&&M.x<=br.x+br.w&&M.y>=br.y&&M.y<=br.y+br.h){openCrew(br.team);return}}}
  // 2. Check player sub click (larger hitbox: 35px)
  const psx=W/2+(game.player.x-cx0)*MTX,psy=H/2+(game.player.depth-cy0)*MTX;
  if(Math.sqrt((M.x-psx)**2+(M.y-psy)**2)<35){openCrew(2);return}
  // 3. Check wrecks
  for(const w of game.wrecks){if(!w.nearPlayer||w.looted)continue;const wx=W/2+(w.x-cx0)*MTX,wy=H/2+(w.depth-cy0)*MTX;if(Math.sqrt((M.x-wx)**2+(M.y-wy)**2)<22){openCrew(1);return}}
  // 4. Check enemies
  for(const e of game.enemies){const ex=W/2+(e.x-cx0)*MTX,ey=H/2+(e.y-cy0)*MTX;const hitR=e.type==='cruiser'?35:e.type==='merchant'?30:25;if(Math.sqrt((M.x-ex)**2+(M.y-ey)**2)<hitR){const tp=game._pendingAttack!==undefined?game._pendingAttack:0;const tn=tp===0?'normal':tp===1?'cruise':'missile';game.fireTorp(e,tn);game._pendingAttack=undefined;return}}
  // Click on empty space clears pending attack
  game._pendingAttack=undefined;
}

function handleCrewClick(){
  const pcx=W/2,pcy=H/2,pw=640,ph=420;
  // Close if clicked outside
  if(M.x<pcx-pw/2||M.x>pcx+pw/2||M.y<pcy-ph/2||M.y>pcy+ph/2){game.state=ST.PLAY;game._crewBtnHover=-1;return}
  // Check team tabs (top)
  for(let i=0;i<5;i++){const tx=pcx-pw/2+8+i*126;if(M.x>=tx&&M.x<=tx+122&&M.y>=pcy-ph/2-28&&M.y<=pcy-ph/2+4){game.crewPanel.team=i;sfxClick();return}}
  // Check action buttons in content area
  const rx=pcx-pw/2+15+160+15,ry=pcy-ph/2+15,dsy=ry+46,aby=dsy+48;
  const acts=[[1],[1],[2],[2],[3]]; // number of actions per team
  const na=acts[game.crewPanel.team][0];
  for(let i=0;i<na;i++){const ay=aby+i*58;if(M.x>=rx&&M.x<=rx+(pw-160-45)&&M.y>=ay&&M.y<=ay+50){execAction(game.crewPanel.team,i);return}}
}

function handleEventClick(){
  if(!game.activeEvent)return;const ecx=W/2,ecy=H/2,ew=580;let yOff=58;const desc=game.activeEvent.description;let line='';for(let i=0;i<desc.length;i++){line+=desc[i];if(line.length>42||i===desc.length-1){yOff+=19;line=''}}
  const eh=310+game.activeEvent.choices.length*58;
  for(let i=0;i<game.activeEvent.choices.length;i++){const cy=ecy-eh/2+yOff+18+i*55;if(M.y>=cy&&M.y<=cy+46&&M.x>=ecx-ew/2+18&&M.x<=ecx+ew/2-18){sfxSel();game.resolveEvent(i);return}}
}

// ===== START =====
requestAnimationFrame(gameLoop);
console.log('SUBMARINE | 北大西洋潜艇战 · 1943');
console.log('W/S:深度 A/D:转向/前进 SPACE:声呐 1-5:小组 点击:攻击/管理');
</script>
